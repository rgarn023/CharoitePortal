name: Charoite Next Lightweight Static Verification
on:
  push:
    paths:
      # Routine Next source pushes must receive a lightweight check even when
      # the milestone-only heavyweight APK job is skipped.
      - 'next-generation/**'
      - '.github/workflows/charoite-agent-pr-check.yml'
      - '.github/workflows/charoite-next.yml'
      - '.github/workflows/wine29-first-provider-crossbuild.yml'
      - '.github/workflows/charoite-continue-notifications.yml'
  pull_request:
    paths:
      # Match push coverage: proposed Next source changes also need static CI.
      - 'next-generation/**'
      - '.github/workflows/charoite-agent-pr-check.yml'
      - '.github/workflows/charoite-next.yml'
      - '.github/workflows/wine29-first-provider-crossbuild.yml'
      - '.github/workflows/charoite-continue-notifications.yml'
  workflow_dispatch:

concurrency:
  group: charoite-next-static-${{ github.ref }}
  cancel-in-progress: true

# Deliberately no signing key, token, uploads, Wine/device execution or merge.
permissions:
  contents: read

jobs:
  validate-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test imports (not Wine)
        run: python3 -m pip install --user --break-system-packages --disable-pip-version-check Pillow==11.3.0 numpy opencv-python-headless imageio-ffmpeg
      - name: Run Android-Next static regression contracts
        run: python3 -m unittest discover -s next-generation/tests -p 'test_*.py' -v
      - name: Verify native v20 GDI replay source contract without execution
        run: python3 -m unittest discover -s analysis/wine29_bootstrap/tests -p test_android_surface_replay_patch.py -v
      - name: Verify v21 missing native GDI surface recovery without execution
        run: python3 -m unittest discover -s analysis/wine29_bootstrap/tests -p test_android_surface_rearm_patch.py -v
      - name: Verify source-matched v22 signed APK cohort hashes without executing Wine
        run: python3 -m unittest discover -s analysis/wine29_bootstrap/tests -p test_v20_apk_native_cohort.py -v
      - name: Verify v22 scaled Win32u Android target without executing Wine
        run: python3 -m unittest discover -s analysis/wine29_bootstrap/tests -p test_android_scaled_surface_target_patch.py -v
      - name: Assert this workflow did not use signing keys or a phone
        run: echo 'CHAROITE_AGENT_PROPOSAL_STATIC_TESTS=PASS'
