name: Wine29 V28 Historical CopyFiles Coverage — Source Only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wine29-v28-copyqueue-source-audit.yml'
      - 'analysis/wine29_bootstrap/**'
      - 'analysis/wine29_bootstrap/tests/test_copyqueue_source_audit.py'
  workflow_dispatch:

# GitHub source artifacts ONLY: never run Wine or Android code. No paid API.
permissions:
  contents: read
  actions: read

jobs:
  pinned-inf-copyqueue-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run synthetic source coverage / safety regressions
        run: |
          python3 -m unittest discover -s analysis/wine29_bootstrap/tests \
            -p 'test_copyqueue_source_audit.py' -v

      - name: Run synthetic pinned provider source dependency tests
        run: |
          python3 -m unittest discover -s analysis/wine29_bootstrap/tests \
            -p 'test_provider_source_audit.py' -v

      - name: Download immutable verified 111-file data artifact to CI scratch ONLY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wine29-copyqueue-sealed"
          gh run download 41947164001 --repo "$GITHUB_REPOSITORY" \
            --name Wine29-07-34-DLL-76-NLS-Sealed-Data-Only-NOT-APK \
            --dir "$RUNNER_TEMP/wine29-copyqueue-sealed"
          echo "ada8bd980722deba16e89231652a25a27a7e197a7638abc9d38a61e0614e412e  $RUNNER_TEMP/wine29-copyqueue-sealed/wine29-07-34-dll-76-nls-data-only.tar.gz" | sha256sum --check

      - name: Download pinned V23 generated Wine INF source candidate — NEVER execute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wine29-copyqueue-setup"
          gh run download 42552476223 --repo "$GITHUB_REPOSITORY" \
            --name Wine29-V23-Pinned-Prefix-Setup-Source-Only-NOT-APK \
            --dir "$RUNNER_TEMP/wine29-copyqueue-setup"
          test -f "$RUNNER_TEMP/wine29-copyqueue-setup/wine.inf"
          test ! -L "$RUNNER_TEMP/wine29-copyqueue-setup/wine.inf"
          echo "5c7a7041399370937bdaaec11bac8ab64b910d6a1877b6afb582ad1d6a2f894a  $RUNNER_TEMP/wine29-copyqueue-setup/wine.inf" | sha256sum --check

      - name: Audit ARM64 INF CopyFiles sections against sealed provider/nls inventory
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/wine29-arm64-copyqueue-source-audit.json"
          python3 analysis/wine29_bootstrap/audit_inf_copyqueue.py \
            --inf "$RUNNER_TEMP/wine29-copyqueue-setup/wine.inf" \
            --sealed "$RUNNER_TEMP/wine29-copyqueue-sealed/wine29-07-34-dll-76-nls-data-only.tar.gz" \
            --out "$GITHUB_WORKSPACE/wine29-arm64-copyqueue-source-audit.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("wine29-arm64-copyqueue-source-audit.json").read_text())
          print("COPY_QUEUE_SECTIONS",r["arm64_copy_sections"])
          print("COPY_QUEUE_ROWS",r["copyfile_rows"])
          print("NLS_NOT_STAGED",r["requested_nls_not_in_sealed"])
          print("RESOURCE_PROVIDERS_OUTSIDE_SEALED_COHORT",r["resource_providers_not_in_sealed_pe"])
          print("V28_RUNTIME_REEXECUTED",r["v28_reused"])
          print("SCM_SUCCESS_VERIFIED",False)
          PY

      - name: Retrieve exact eight pinned Wine Makefiles (SOURCE ONLY)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_REV=c74acb09d51b447f5d5ac56c87608d3ec565a767
          BASE="$RUNNER_TEMP/wine29-pinned-provider-sources"
          test ! -e "$BASE"
          mkdir -p "$BASE"
          for name in mscms hidclass.sys mouhid.sys winebth.sys winebus.sys winehid.sys wineusb.sys winexinput.sys; do
            mkdir -p "$BASE/$name"
            test ! -e "$BASE/$name/Makefile.in"
            gh api "repos/The412Banner/proton-wine/contents/dlls/$name/Makefile.in?ref=$SOURCE_REV" \
              --jq '.content' | base64 --decode > "$BASE/$name/Makefile.in"
          done
          echo "PINNED_WINE_SOURCE_PROVIDER_MAKEFILES_DOWNLOADED=8"

      - name: Audit exactly pinned provider build and import requirements
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/wine29-arm64-provider-source-audit.json"
          python3 analysis/wine29_bootstrap/audit_provider_sources.py \
            --source-dir "$RUNNER_TEMP/wine29-pinned-provider-sources" \
            --sealed "$RUNNER_TEMP/wine29-copyqueue-sealed/wine29-07-34-dll-76-nls-data-only.tar.gz" \
            --copyqueue "$GITHUB_WORKSPACE/wine29-arm64-copyqueue-source-audit.json" \
            --out "$GITHUB_WORKSPACE/wine29-arm64-provider-source-audit.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("wine29-arm64-provider-source-audit.json").read_text())
          print("VERIFIED_PINNED_PROVIDER_MAKEFILES",r["provider_source_files_verified"])
          print("REQUIRE_UNIX_COMPANION",r["unix_companion_required_by"])
          print("REQUIRE_EXTERNAL_BUILD_MACRO",r["external_build_macro_modules"])
          print("RUNTIME_CORRECTION_VERIFIED",r["runtime_correction_verified"])
          # This artifact is a dependency PLAN, never evidence of a
          # cross-built ARM64 PE, native companion, or working Wine runtime.
          expected = {
              "source_only": True,
              "wine_executed": False,
              "phone_accessed": False,
              "v28_reused": False,
              "runtime_correction_verified": False,
              "provider_pe_binaries_verified": False,
              "provider_native_companions_verified": False,
              "provider_import_closure_verified": False,
              "provider_source_build_order_only": True,
              "provider_crossbuild_work_queue_only": True,
          }
          for key, value in expected.items():
              if r.get(key) is not value:
                  raise SystemExit(f"Unsafe or missing source-only evidence: {key}")
          names = {"mscms.dll", "hidclass.sys", "mouhid.sys",
                   "winebth.sys", "winebus.sys", "winehid.sys",
                   "wineusb.sys", "winexinput.sys"}
          order = r.get("provider_source_build_order")
          queue = r.get("provider_crossbuild_work_queue")
          rows = r.get("providers")
          if (not isinstance(order, list) or len(order) != 8 or
                  set(order) != names or not isinstance(queue, list) or
                  not isinstance(rows, list) or len(rows) != 8 or
                  {row.get("module") for row in rows} != names or
                  [entry.get("provider") for entry in queue] != order):
              raise SystemExit("Incomplete or inconsistent provider build queue")
          by_name = {row["module"]: row for row in rows}
          for entry in queue:
              name = entry["provider"]
              row = by_name[name]
              blockers = row.get("crossbuild_verification_blockers")
              if (row.get("crossbuild_verified") is not False or
                      not isinstance(blockers, list) or
                      "PINNED_ARM64_PE_BUILD_AND_IMPORT_TABLE" not in blockers or
                      entry.get("blockers") != blockers):
                  raise SystemExit(f"Unsafe cross-build status for {name}")
          print("UNVERIFIED_PROVIDER_BUILD_QUEUE_CONTRACT=PASS")
          PY

      - name: Publish SOURCE-ONLY coverage report (NOT APK or phone diagnostic)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wine29-ARM64-CopyQueue-SOURCE-ONLY-NOT-APK
          path: |
            wine29-arm64-copyqueue-source-audit.json
            wine29-arm64-provider-source-audit.json
          if-no-files-found: error
          retention-days: 30
