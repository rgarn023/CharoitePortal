              with Image.open(io.BytesIO(scene)) as picture:
                  picture.load()
                  assert picture.size == (1536, 1536)
                  assert picture.format == "JPEG"
              assert "res/drawable-nodpi-v4/charoite_next_boot_scene.png" not in z.namelist()
              # The icon keeps exact original bytes. Only the boot gets a
              # separate transparent-corner image and violet full bleed.
              foreground = z.read("res/drawable-nodpi-v4/charoite_next_boot_unframed.png")
              backdrop = z.read("res/drawable-nodpi-v4/charoite_next_boot_backdrop.jpg")
              portrait = z.read("res/drawable-nodpi-v4/charoite_next_boot_portrait.jpg")
              with Image.open(io.BytesIO(portrait)) as portrait_art:
                  assert portrait_art.size == (960, 1840), "Expected true 960x1840 portrait asset"
                  assert portrait_art.mode == "RGB"
                  for xy in ((0,0), (959,0), (0,1839), (959,1839)):
                      assert max(portrait_art.getpixel(xy)) > 20, "Original icon edge remained"
              print("CHAROITE_NEXT_SEAMLESS_PORTRAIT_BOOT=PASS")
              video_files = [n for n in z.namelist()
                             if n.endswith("/charoite_c_energy_reference_portal_7s.mp4")]
              assert len(video_files) == 1, "Expected exactly one packaged Mystic C movie"
              video_info = z.getinfo(video_files[0])
              assert video_info.compress_type == zipfile.ZIP_STORED, (
                  "Android openRawResourceFd requires uncompressed MP4")
              video = z.read(video_files[0])
              assert len(video) > 150000 and b"ftyp" in video[:24]
              assert b"avc1" in video, "Mystic C video must be AVC/H.264 for Android"
              assert b"mp4a" not in video, "The Mystic C animation must be SILENT"
              print("CHAROITE_NEXT_C_ENERGY_REFERENCE_PORTAL_MP4_PACKAGED=PASS")
              with Image.open(io.BytesIO(foreground)) as fg:
                  fg.load()
                  assert fg.mode == "RGBA" and fg.size == (1536, 1536)
                  for xy in ((0,0),(1535,0),(0,1535),(1535,1535)):
                      assert fg.getpixel(xy)[3] < 8, "Black outer icon corner still visible"
                  assert fg.getpixel((768,768))[3] > 250
              with Image.open(io.BytesIO(backdrop)) as bg:
                  bg.load()
                  assert bg.size == (900,1600)
                  for xy in ((0,0),(899,0),(0,1599),(899,1599)):
                      assert max(bg.getpixel(xy)) > 12, "Black background corner remained"
              print("CHAROITE_NEXT_FULLBLEED_BOOT_BLACK_FRAME_REMOVED=PASS")
              print("CHAROITE_NEXT_LAUNCHER_ICON_ORIGINAL_UNMODIFIED=PASS")
              print("CHAROITE_NEXT_USER_APPROVED_1536PX_ARTWORK_EXACT_MATCH=PASS")
              print("CHAROITE_NEXT_BOOT_AND_LAUNCHER_IDENTICAL_PIXELS=PASS")
              audio_files=[p for p in z.namelist()
                           if p.endswith("/charoite_crystal_startup.wav")]
              assert len(audio_files)==1, "Missing or duplicate original startup chime"
              with wave.open(io.BytesIO(z.read(audio_files[0])),"rb") as sound:
                  assert sound.getnchannels()==1
                  assert sound.getsampwidth()==2
                  assert sound.getframerate()==44100
                  assert sound.getnframes()==round(44100*7.0)
              print("CHAROITE_NEXT_SEVEN_SECOND_BOOT_SYNCED_CRYSTAL_SOUND=PASS")
          PY

