name: Charoite Controlled Agent Safety Tests

on:
  push:
    paths:
      - '.github/automation/**'
      - '.github/workflows/charoite-controlled-codex.yml'
      - '.github/workflows/charoite-agent-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test validated issue selection and strict patch gate offline
        run: python3 -m unittest discover -s .github/automation/tests -p 'test_*.py' -v
      - name: Verify no app or phone test was launched
        run: |
          echo 'CHAROITE_AGENT_OFFLINE_GUARDS=PASS'
          echo 'OPENAI_API_KEY was not read; no Wine execution, code changes or API billing.'
