      - name: Restore Charoite Next APK signing identity
        id: signing-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/charoite-next.keystore
          key: charoite-next-debug-signing-v1

      - name: Create signing key on first build only
        run: |
