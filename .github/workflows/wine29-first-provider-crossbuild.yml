name: Wine29 Missing Provider ARM64 PE Cross-Build (No APK)
on:
  workflow_dispatch:
  # Build only when inputs change or manually dispatched; no hourly duplicate rebuilds.
  push:
    branches: [main]
    paths:
      - '.github/workflows/wine29-first-provider-crossbuild.yml'
      - 'next-generation/charoite-wine/prepare-source.sh'
      - 'next-generation/charoite-wine/build-arm64ec-ntdll.sh'
      - 'next-generation/wine29-imports/classify.py'

permissions:
  contents: read

# Serialize cross-builds without cancelling an active evidence-producing run.
# A new run may wait; GitHub can still replace an older pending run.
concurrency:
  group: wine29-first-provider-crossbuild-v3
  cancel-in-progress: false

# Automatically rebuild only when provider build inputs change on main; manual dispatch remains available.
# No Wine process, Android app, device, prefix, historical scratch, or APK.
jobs:
  mouhid-arm64-pe:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check shell block syntax before expensive toolchain setup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, tempfile
          workflow = pathlib.Path(".github/workflows/wine29-first-provider-crossbuild.yml")
          lines = workflow.read_text().splitlines()
          blocks = []
          current = None
          for line in lines:
              if line == "        run: |":
                  current = []
                  blocks.append(current)
              elif current is not None:
                  if line.startswith("          "):
                      current.append(line[10:])
                  elif line.strip() == "":
                      current.append("")
                  else:
                      current = None
          assert len(blocks) >= 5, "Unexpected workflow run-block count"
          for index, block in enumerate(blocks, 1):
              with tempfile.NamedTemporaryFile(mode="w", suffix=".sh") as script:
                  script.write("\n".join(block) + "\n")
                  script.flush()
                  subprocess.run(["bash", "-n", script.name], check=True)
              print(f"SHELL_BLOCK_{index}_SYNTAX=PASS")
          PY
      - name: Verify pinned source and isolated output contracts
        run: |
          set -euo pipefail
          grep -Fq 'c74acb09d51b447f5d5ac56c87608d3ec565a767' next-generation/charoite-wine/prepare-source.sh
          test ! -e "$GITHUB_WORKSPACE/wine29-first-provider-candidate"
          test -f next-generation/charoite-wine/build-arm64ec-ntdll.sh
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.3.13750724'
          test -x "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
      - name: Fetch checksum-pinned LLVM-MinGW cross-compiler
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/llvm-mingw-20261020.tar.xz"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 25 --max-time 300 \
            'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz' -o "$ARCHIVE"
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  $ARCHIVE" | sha256sum --check
          mkdir "$RUNNER_TEMP/charoite-llvm-mingw"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/charoite-llvm-mingw" --strip-components=1
          test -x "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj"
      - name: Prepare exact pinned Wine source in fresh CI scratch
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/charoite-first-provider-source"
          bash next-generation/charoite-wine/prepare-source.sh "$ROOT"
          test -f "$ROOT/dlls/mouhid.sys/Makefile.in"
          test -f "$ROOT/dlls/hidclass.sys/Makefile.in"
          test -f "$ROOT/dlls/hidparse.sys/Makefile.in"
          test -f "$ROOT/dlls/winehid.sys/Makefile.in"
          test -f "$ROOT/dlls/winexinput.sys/Makefile.in"
          grep -Eq '^MODULE[[:space:]]*=[[:space:]]*hidparse.sys$' "$ROOT/dlls/hidparse.sys/Makefile.in"
          grep -Eq '^MODULE[[:space:]]*=[[:space:]]*mouhid.sys$' "$ROOT/dlls/mouhid.sys/Makefile.in"
          grep -Eq '^IMPORTS[[:space:]]*=[[:space:]]*ntoskrnl hidparse win32u$' "$ROOT/dlls/mouhid.sys/Makefile.in"
          git -C "$ROOT" diff --check
      - name: Inventory remaining Wine29 provider source requirements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"charoite-first-provider-source"
          targets=("mscms.dll","winebth.sys","winebus.sys","wineusb.sys")
          inventory={}
          # Compare final patched source with pinned upstream tree without modifying it.
          import subprocess
          for name in targets:
              relative=f"dlls/{name.removesuffix('.dll')}/Makefile.in"
              upstream=subprocess.run(["git","-C",str(root),"cat-file","-e",
                                       "c74acb09d51b447f5d5ac56c87608d3ec565a767:"+relative],
                                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              print(f"{name.upper()}_UPSTREAM_PINNED_MAKEFILE={'PRESENT' if upstream.returncode==0 else 'ABSENT'}")
          for name in targets:
              makefile=root/"dlls"/name.removesuffix(".dll")/"Makefile.in"
              upstream_present=subprocess.run(["git","-C",str(root),"cat-file","-e",
                   "c74acb09d51b447f5d5ac56c87608d3ec565a767:dlls/"+name.removesuffix(".dll")+"/Makefile.in"],
                   stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if not makefile.is_file() or makefile.is_symlink():
                  inventory[name]={"makefile":str(makefile.relative_to(root)),
                                   "source_present":False,"upstream_source_present":upstream_present,"imports_declared":[],
                                   "unix_libs_declared":[],"sources_declared":[],
                                   "native_companion_verified":False,
                                   "pe_build_verified":False,"runtime_verified":False}
                  print(f"{name.upper()}_PINNED_SOURCE=ABSENT; NOT BUILT")
                  continue
              source=makefile.read_text().splitlines()
              def fields(key):
                  values=[]
                  for line in source:
                      if line.startswith(key+" ") or line.startswith(key+"="):
                          values.extend(line.partition("=")[2].split())
                  return sorted(set(values))
              inventory[name]={"makefile":str(makefile.relative_to(root)),
                               "source_present":True,"upstream_source_present":upstream_present,
                               "imports_declared":fields("IMPORTS"),
                               "unix_libs_declared":fields("UNIX_LIBS"),
                               "sources_declared":fields("SOURCES"),
                               "native_companion_verified":False,
                               "pe_build_verified":False,
                               "runtime_verified":False}
          out=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"wine29-provider-source-inventory.json"
          out.write_text(json.dumps({"source_commit":"c74acb09d51b447f5d5ac56c87608d3ec565a767",
                                    "scope":"pinned source Makefile declarations only",
                                    "providers":inventory},indent=2,sort_keys=True)+chr(10))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write("## Remaining provider source inventory (not built)"+chr(10)+chr(10))
              summary.write("| Provider | Declared imports | Unix libraries |"+chr(10)+"| --- | --- | --- |"+chr(10))
              for name,info in inventory.items():
                  summary.write(f"| {name} | {', '.join(info['imports_declared']) or 'None declared'} | {', '.join(info['unix_libs_declared']) or 'None declared'} |"+chr(10))
              summary.write(chr(10)+"Source inventory only; native companion closure and runtime NOT VERIFIED."+chr(10))
          print("REMAINING_PROVIDER_SOURCE_INVENTORY=PASS")
          PY
      - name: Publish pinned provider source inventory (NOT APK)
        uses: actions/upload-artifact@v4
        with:
          name: Wine29-Remaining-Provider-Source-Inventory-NOT-APK
          path: wine29-provider-source-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Build pinned Wine ARM64 host and Android native toolchain (no execution)
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-arm64ec-ntdll.sh \
            "$RUNNER_TEMP/charoite-first-provider-source" \
            "$ANDROID_HOME/ndk/27.3.13750724" \
            "$RUNNER_TEMP/charoite-llvm-mingw"
      - name: Cross-compile five pinned ARM64 HID/XInput PE modules; inspect imports
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/charoite-first-provider-source"
          BUILD="$ROOT/charoite-arm64ec-android"
          cd "$BUILD"
          # Five pinned-source Windows ARM64 PE modules, including HID parser dependency; no Wine execution.
          make -j2 dlls/mouhid.sys/aarch64-windows/mouhid.sys dlls/hidclass.sys/aarch64-windows/hidclass.sys dlls/hidparse.sys/aarch64-windows/hidparse.sys dlls/winehid.sys/aarch64-windows/winehid.sys dlls/winexinput.sys/aarch64-windows/winexinput.sys
          OUT="$GITHUB_WORKSPACE/wine29-first-provider-candidate"
          mkdir "$OUT"
          for module in mouhid hidclass hidparse winehid winexinput; do
            BIN="$BUILD/dlls/$module.sys/aarch64-windows/$module.sys"
            test -s "$BIN"
            test ! -L "$BIN"
            cp "$BIN" "$OUT/$module-arm64.sys"
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" --file-headers "$BIN" > "$OUT/$module-pe-header.txt"
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" --coff-imports "$BIN" > "$OUT/$module-pe-imports.txt"
          done
          python3 - "$OUT" <<'PY'
          import hashlib, importlib.util, json, pathlib, struct, sys
          out=pathlib.Path(sys.argv[1])
          path=pathlib.Path(__import__("os").environ["GITHUB_WORKSPACE"])/"next-generation/wine29-imports/classify.py"
          spec=importlib.util.spec_from_file_location("charoite_imports",path)
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          for name in ("mouhid", "hidclass", "hidparse", "winehid", "winexinput"):
            binary=out/(name+"-arm64.sys")
            raw=binary.read_bytes()
            assert 1000 < len(raw) < 32*1024*1024
            assert raw[:2] == b"MZ"
            offset=struct.unpack_from("<I",raw,0x3c)[0]
            assert 64 <= offset < len(raw)-24 and raw[offset:offset+4] == b"PE\0\0"
            machine=struct.unpack_from("<H",raw,offset+4)[0]
            assert machine == 0xAA64, f"{name}: expected ARM64 PE 0xAA64, got {machine:04x}"
            ordinary, delayed=module.pe_imports(raw)
            assert ordinary, f"{name}: provider PE has no ordinary imports; investigate"
            report={
              "schema_version":1, "module":name+".sys",
              "source_commit":"c74acb09d51b447f5d5ac56c87608d3ec565a767",
              "package":"com.charoitx", "machine":"0xAA64",
              "sha256":hashlib.sha256(raw).hexdigest(), "bytes":len(raw),
              "ordinary_imports":ordinary, "delay_imports":delayed,
              "pe_compilation_verified":True,
              "provider_import_closure_verified":False,
              "native_companion_closure_verified":False,
              "runtime_compatibility_verified":False,
              "wine_executed":False, "phone_tested":False,
              "historical_scratch_accessed":False
            }
            (out/(name+"-manifest.json")).write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
            print(f"{name.upper()}_ARM64_PE_BUILD_AND_IMPORT_INSPECTION=PASS")
          # Distinguish imports resolved within this candidate batch from imports
          # requiring independently verified PE/native providers.
          batch={name+".sys" for name in ("mouhid", "hidclass", "hidparse", "winehid", "winexinput")}
          closure={}
          for name in ("mouhid", "hidclass", "hidparse", "winehid", "winexinput"):
            manifest=json.loads((out/(name+"-manifest.json")).read_text())
            imports=sorted(set(manifest["ordinary_imports"]+manifest["delay_imports"]))
            local=sorted(x for x in imports if x.lower() in batch)
            external=sorted(x for x in imports if x.lower() not in batch)
            closure[name+".sys"]={"batch_resolved":local,"external_unverified":external}
            print(f"{name.upper()}_BATCH_RESOLVED={','.join(local) or 'none'}")
            print(f"{name.upper()}_EXTERNAL_UNVERIFIED={','.join(external) or 'none'}")
          (out/"batch-import-closure.json").write_text(
              json.dumps({"schema_version":1,"scope":"five-module candidate batch only",
                          "module_imports":closure,"full_provider_closure_verified":False,
                          "native_companion_closure_verified":False,
                          "runtime_compatibility_verified":False},
                         indent=2,sort_keys=True)+"\n")
          print("IMPORT_CLOSURE_AND_RUNTIME=UNVERIFIED")
          summary=pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as stream:
            stream.write("## Wine29 source-only candidate coverage\n\n")
            stream.write("| Module | Candidate-batch imports | External imports (unverified) |\n")
            stream.write("| --- | --- | --- |\n")
            for name, details in sorted(closure.items()):
              local=", ".join(details["batch_resolved"]) or "None"
              external=", ".join(details["external_unverified"]) or "None"
              stream.write(f"| {name} | {local} | {external} |\n")
            stream.write("\n**Full dependency closure, native companions and Android runtime: NOT VERIFIED.**\n")
          print("GITHUB_STEP_SUMMARY=WRITTEN")
          PY
      - name: Probe remaining four provider PE build targets without blocking proven batch
        continue-on-error: true
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/charoite-first-provider-source"
          BUILD="$ROOT/charoite-arm64ec-android"
          OUT="$GITHUB_WORKSPACE/wine29-provider-build-probes"
          mkdir "$OUT"
          cd "$BUILD"
          # Capture generated-target evidence before compiling: wineusb.sys has
          # a pinned Makefile.in but its aarch64-windows target was not emitted.
          # This distinguishes configure/feature gating from compiler failures.
          python3 - "$BUILD" "$OUT" <<'PY'
          import pathlib,sys,json
          build=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          report={}
          for module in ('mscms.dll','winebth.sys','winebus.sys','wineusb.sys'):
              source=module.removesuffix('.dll')
              directory=build/'dlls'/source
              paths=[directory/'Makefile',directory/'aarch64-windows',directory/'aarch64-windows'/module]
              report[module]={
                  'generated_makefile_present':paths[0].is_file(),
                  'arm64_output_directory_present':paths[1].is_dir(),
                  'arm64_binary_present_before_probe':paths[2].is_file(),
                  'configure_or_generation_failure_proven':False,
              }
              print('GENERATED_TARGET_INVENTORY',module,json.dumps(report[module],sort_keys=True))
          (out/'generated-target-inventory.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          # Keep bounded, source-only evidence for USB configure gating.
          # A missing Makefile may be caused by feature detection even when
          # --without-usb was removed; do not assume the PE target is enabled.
          python3 - "$ROOT" "$BUILD" "$OUT" <<'PY'
          import pathlib,sys,json,re
          root,build,out=map(pathlib.Path,sys.argv[1:])
          files={'source_makefile':root/'dlls/wineusb.sys/Makefile.in',
                 'generated_makefile':build/'dlls/wineusb.sys/Makefile',
                 'configure_log':build/'config.log',
                 'config_status':build/'config.status'}
          report={}
          for label,path in files.items():
              exists=path.is_file() and not path.is_symlink()
              matches=[]
              if exists:
                  with path.open('r',encoding='utf-8',errors='replace') as stream:
                      for lineno,line in enumerate(stream,1):
                          if re.search(r'wineusb|libusb|without.usb|have_usb|usb_1_0',line,re.I):
                              matches.append(f'{lineno}: {line.rstrip()[:300]}')
                              if len(matches)>=80:break
              report[label]={'present':exists,'matched_lines':matches}
          # Distinguish missing Android libusb headers from a generic missing make rule.
          log=files['configure_log']
          if log.is_file() and not log.is_symlink():
              content=log.read_text(encoding='utf-8',errors='replace')
              report['usb_dependency_diagnosis']={
                  'libusb_header_check_failed':bool(re.search(r'checking for libusb\.h\.\.\. no',content)),
                  'libusb_api_check_failed':bool(re.search(r'libusb_interrupt_event_handler.*(?:no|not found)',content)),
                  'runtime_compatibility_verified':False}
          (out/'usb-configure-evidence.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('WINEUSB_CONFIGURE_EVIDENCE',json.dumps({k:v.get('present',False) for k,v in report.items() if k!='usb_dependency_diagnosis'},sort_keys=True))
          PY
          # Attempt the ntoskrnl PE binary independently: the HID linker has
          # previously used its import library, which does not prove a PE image.
          # Keep failure nonfatal and log bounded; never execute Wine.
          NT_TARGET="dlls/ntoskrnl.exe/aarch64-windows/ntoskrnl.exe"
          NT_LOG="$OUT/ntoskrnl.exe-build.log"
          NT_STATUS="build_failed"
          if timeout 180 make -j2 "$NT_TARGET" > "$NT_LOG" 2>&1; then
            NT_BIN="$BUILD/$NT_TARGET"
            NT_STATUS="missing_binary"
            if test -s "$NT_BIN" && test ! -L "$NT_BIN"; then
              if "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" --file-headers "$NT_BIN" > "$OUT/ntoskrnl.exe-pe-header.txt" 2>&1; then
                # A successful llvm-readobj invocation alone does not establish
                # that the file is a real ARM64 PE executable.
                if python3 - "$NT_BIN" <<'PYPE'
          import pathlib,struct,sys
          p=pathlib.Path(sys.argv[1])
          with p.open('rb') as f:
              dos=f.read(64)
              assert len(dos)==64 and dos[:2]==b'MZ'
              offset=struct.unpack_from('<I',dos,0x3c)[0]
              assert 64<=offset<p.stat().st_size-24
              f.seek(offset)
              pe=f.read(24)
              assert pe[:4]==b'PE'+bytes(2)
              assert struct.unpack_from('<H',pe,4)[0]==0xAA64
          print('NTOSKRNL_ARM64_PE_HEADER=PASS')
          PYPE
                then
                  NT_STATUS="arm64_pe_header_verified_not_runtime"
                  if "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" --coff-imports "$NT_BIN" > "$OUT/ntoskrnl.exe-pe-imports.txt" 2>&1; then
                    echo "NTOSKRNL_IMPORT_INSPECTION=PASS"
                  else
                    echo "NTOSKRNL_IMPORT_INSPECTION=FAILED_NOT_RUNTIME_VERIFIED"
                  fi
                  # Bound raw evidence; an import listing is not proof of closure.
                  if test -f "$OUT/ntoskrnl.exe-pe-imports.txt"; then
                    tail -c 65536 "$OUT/ntoskrnl.exe-pe-imports.txt" > "$OUT/ntoskrnl.exe-pe-imports.bounded"
                    mv "$OUT/ntoskrnl.exe-pe-imports.bounded" "$OUT/ntoskrnl.exe-pe-imports.txt"
                  fi
                else
                  NT_STATUS="invalid_arm64_pe_header"
                fi
              else
                NT_STATUS="invalid_pe_header"
              fi
            fi
          else
            NT_EXIT_CODE=$?
          fi
          # Exit 124 is GNU timeout's expiry code; preserve other build errors.
          if test "$NT_STATUS" = "build_failed"; then
            if test "${NT_EXIT_CODE:-0}" -eq 124; then NT_STATUS="build_timed_out"; fi
          fi
          printf '%s\n' "$NT_STATUS" > "$OUT/ntoskrnl.exe-status.txt"
          echo "NTOSKRNL_PE_BUILD_PROBE=$NT_STATUS"
          # Cap diagnostics to avoid uploading unbounded compiler output.
          if test -f "$NT_LOG"; then tail -c 65536 "$NT_LOG" > "$NT_LOG.bounded"; mv "$NT_LOG.bounded" "$NT_LOG"; fi
          # Inspect the generated make database without executing any Wine code.
          # A missing rule is a build-generation issue, not a PE compiler failure.
          python3 - "$BUILD" "$OUT" <<'PY'
          import pathlib,subprocess,sys,json
          build=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          result={}
          for name in ('mscms.dll','winebth.sys','winebus.sys','wineusb.sys'):
              target=f'dlls/{name.removesuffix(".dll")}/aarch64-windows/{name}'
              try:
                  proc=subprocess.run(['make','--no-print-directory','-n',target],cwd=build,
                                      capture_output=True,text=True,timeout=25)
                  diagnostic=(proc.stderr+'\n'+proc.stdout)[-8192:]
                  exit_code=proc.returncode
                  timed_out=False
              except subprocess.TimeoutExpired:
                  diagnostic='Make target dry run exceeded 25 seconds; result inconclusive.\n'
                  exit_code=None
                  timed_out=True
              missing='No rule to make target' in diagnostic
              result[name]={'target':target,'dry_run_exit_code':exit_code,
                            'no_rule_reported':missing,'dry_run_success':exit_code==0,
                            'timed_out':timed_out}
              (out/(name+'-target-dry-run.txt')).write_text(diagnostic)
              print('GENERATED_MAKE_TARGET',name,json.dumps(result[name],sort_keys=True))
          (out/'generated-make-targets.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
          for module in mscms.dll winebth.sys winebus.sys wineusb.sys; do
            echo "Probing source-built PE target: $module"
            LOG="$OUT/$module-build.log"
            SOURCE_DIR="${module%.dll}"
            if test ! -f "$ROOT/dlls/$SOURCE_DIR/Makefile.in"; then
              printf '%s\n' "pinned source Makefile.in absent; no build attempted" > "$LOG"
              printf '%s\n' "pinned_source_absent" > "$OUT/$module-status.txt"
              echo "$module: pinned source absent; no build attempted" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            STATUS="build_failed_or_timed_out"
            if timeout 180 make -j2 "dlls/$SOURCE_DIR/aarch64-windows/$module" > "$LOG" 2>&1; then
              BIN="$BUILD/dlls/$SOURCE_DIR/aarch64-windows/$module"
              STATUS="missing_binary_or_invalid_header"
              if test -s "$BIN" && test ! -L "$BIN"; then
                if "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" --file-headers "$BIN" > "$OUT/$module-pe-header.txt" 2>&1; then
                  if python3 - "$BIN" "$OUT/$module-manifest.json" "$module" <<'PY'
          import hashlib,json,pathlib,struct,sys
          binary=pathlib.Path(sys.argv[1]); manifest=pathlib.Path(sys.argv[2]); module=sys.argv[3]
          raw=binary.read_bytes()
          assert 1024<len(raw)<32*1024*1024 and raw[:2]==b"MZ"
          offset=struct.unpack_from("<I",raw,0x3c)[0]
          assert 64<=offset<len(raw)-24 and raw[offset:offset+4]==b"PE"+bytes(2)
          assert struct.unpack_from("<H",raw,offset+4)[0]==0xAA64
          manifest.write_text(json.dumps({
              "schema_version":1,"module":module,"machine":"0xAA64",
              "source_commit":"c74acb09d51b447f5d5ac56c87608d3ec565a767",
              "sha256":hashlib.sha256(raw).hexdigest(),"bytes":len(raw),
              "pe_compilation_verified":True,
              "provider_import_closure_verified":False,
              "native_companion_closure_verified":False,
              "runtime_compatibility_verified":False,
              "wine_executed":False,"phone_tested":False},indent=2,sort_keys=True)+chr(10))
          PY
                  then
                    # Record actual PE imports for dependency-closure analysis.
                    # Import inventory is evidence only, not proof of resolution.
                    "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
                      --coff-imports "$BIN" \
                      > "$OUT/$module-pe-imports.txt"
                    python3 - "$OUT/$module-pe-imports.txt" "$OUT/$module-import-inventory.json" "$module" <<'PYIMPORT'
          import json,re,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text(errors="replace").splitlines()
          dlls=sorted(set(m.group(1).lower() for line in lines
              if (m:=re.search(r"^\s*Name:\s*(\S+\.(?:dll|sys|exe))\s*$",line,re.I))))
          expected={
              "mscms.dll":{"advapi32.dll","shlwapi.dll"},
              "winebth.sys":{"ntoskrnl.exe"},
              "winebus.sys":{"ntoskrnl.exe","hidparse.sys"},
              "wineusb.sys":{"ntoskrnl.exe"}
          }
          module=sys.argv[3]
          assert module in expected, f"unexpected provider {module}"
          assert expected[module].issubset(set(dlls)), (
              f"{module}: missing expected imports {sorted(expected[module]-set(dlls))}")
          Path(sys.argv[2]).write_text(json.dumps({
              "schema_version":1,"imported_module_names":dlls,
              "import_count":len(dlls),"resolution_verified":False,
              "native_companion_closure_verified":False
          },indent=2,sort_keys=True)+chr(10))
          print("PROVIDER_IMPORT_INVENTORY",sys.argv[2],",".join(dlls))
          PYIMPORT
                    cp "$BIN" "$OUT/$module-arm64-pe-candidate"
                    STATUS="arm64_pe_candidate_verified"
                  fi
                fi
              fi
            fi
            printf '%s\n' "$STATUS" > "$OUT/$module-status.txt"
            echo "$module: $STATUS; dependency/native companion/runtime closure NOT verified" >> "$GITHUB_STEP_SUMMARY"
            echo "PROVIDER_PROBE_RESULT module=$module status=$STATUS"
            if test "$STATUS" != arm64_pe_candidate_verified && test -f "$LOG"; then
              echo "PROVIDER_PROBE_DIAGNOSTIC_BEGIN $module"
              tail -n 16 "$LOG" | cut -c 1-240
              echo "PROVIDER_PROBE_DIAGNOSTIC_END $module"
            fi
            if test -f "$LOG"; then
              tail -c 65536 "$LOG" > "$LOG.bounded" || :
              mv "$LOG.bounded" "$LOG"
            fi
          done
      - name: Summarize provider PE dependency closure without executing Wine
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("wine29-provider-build-probes")
          if not root.is_dir() or root.is_symlink():
              print("PROVIDER_CLOSURE_REPORT=UNAVAILABLE; probe directory missing")
              raise SystemExit(0)
          modules=("mscms.dll","winebth.sys","winebus.sys","wineusb.sys")
          batch={"mouhid.sys","hidclass.sys","hidparse.sys","winehid.sys","winexinput.sys"}
          records={}
          for module in modules:
              status_file=root/(module+"-status.txt")
              inventory_file=root/(module+"-import-inventory.json")
              status=status_file.read_text().strip() if status_file.is_file() and not status_file.is_symlink() else "missing_status"
              imports=[]
              if inventory_file.is_file() and not inventory_file.is_symlink():
                  imports=json.loads(inventory_file.read_text()).get("imported_module_names",[])
              assert isinstance(imports,list) and all(isinstance(x,str) for x in imports)
              if status=="arm64_pe_candidate_verified":
                  assert imports, f"{module}: verified PE candidate has no dependency inventory"
              records[module]={
                  "build_status":status,
                  "imports":imports,
                  "candidate_batch_imports":sorted(set(imports)&batch),
                  "external_imports_unresolved":sorted(set(imports)-batch),
                  "all_imports_resolved":False,
                  "android_native_companions_verified":False,
                  "runtime_compatibility_verified":False,
              }
              print("PROVIDER_DEPENDENCY_GATE",module,status,"external="+",".join(records[module]["external_imports_unresolved"]))
          # Report actual file presence, not loader resolution or ABI compatibility.
          build=pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"charoite-first-provider-source/charoite-arm64ec-android"
          candidates={
              "ntoskrnl.exe":build/"dlls/ntoskrnl.exe/aarch64-windows/ntoskrnl.exe",
              "hidparse.sys":build/"dlls/hidparse.sys/aarch64-windows/hidparse.sys",
          }
          dependency_files={}
          import struct
          for name,path in candidates.items():
              present=path.is_file() and not path.is_symlink() and path.stat().st_size>1024
              arm64_header=False
              if present:
                  with path.open("rb") as stream:
                      header=stream.read(4096)
                  if len(header)>=64 and header[:2]==b"MZ":
                      offset=struct.unpack_from("<I",header,0x3c)[0]
                      if offset+6<=len(header):
                          arm64_header=(header[offset:offset+4]==b"PE"+bytes(2)
                                        and struct.unpack_from("<H",header,offset+4)[0]==0xAA64)
              source_makefile=build.parent/"dlls"/name/"Makefile.in"
              generated_makefile=build/"dlls"/name/"Makefile"
              dependency_files[name]={"pinned_source_makefile_present":source_makefile.is_file() and not source_makefile.is_symlink(),
                                      "generated_makefile_present":generated_makefile.is_file() and not generated_makefile.is_symlink(),
                                      "pe_candidate_file_present":present,
                                      "arm64_pe_header_verified":arm64_header,
                                      "import_resolution_verified":False,
                                      "runtime_compatibility_verified":False}
              print("PROVIDER_DEPENDENCY_FILE",name,
                    "source_makefile="+str(dependency_files[name]["pinned_source_makefile_present"]).lower(),
                    "generated_makefile="+str(dependency_files[name]["generated_makefile_present"]).lower(),
                    "present="+str(present).lower(),
                    "arm64_pe_header="+str(arm64_header).lower())
          report={"schema_version":2,"source_only":True,"full_provider_closure_verified":False,
                  "dependency_file_inventory":dependency_files,"modules":records}
          (root/"provider-dependency-closure.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("PROVIDER_DEPENDENCY_CLOSURE=UNVERIFIED")
          PY
      - name: Publish remaining-provider build probe logs (NOT APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wine29-Remaining-Provider-Build-Probes-NOT-APK
          path: wine29-provider-build-probes/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify five-module evidence set before publishing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("wine29-first-provider-candidate")
          names=("mouhid","hidclass","hidparse","winehid","winexinput")
          assert root.is_dir() and not root.is_symlink()
          for name in names:
              binary=root/(name+"-arm64.sys")
              manifest=root/(name+"-manifest.json")
              assert binary.is_file() and not binary.is_symlink()
              assert manifest.is_file() and not manifest.is_symlink()
              raw=binary.read_bytes()
              info=json.loads(manifest.read_text())
              assert 1024<len(raw)<32*1024*1024
              offset=struct.unpack_from("<I",raw,0x3c)[0]
              assert raw[:2]==b"MZ" and 64<=offset<len(raw)-24
              assert raw[offset:offset+4]==b"PE\x00\x00"
              assert struct.unpack_from("<H",raw,offset+4)[0]==0xaa64
              assert hashlib.sha256(raw).hexdigest()==info["sha256"]
              assert info["module"]==name+".sys"
              assert info["provider_import_closure_verified"] is False
              assert info["runtime_compatibility_verified"] is False
              print(f"{name.upper()}_EVIDENCE_INTEGRITY=PASS")
          closure=json.loads((root/"batch-import-closure.json").read_text())
          assert closure["full_provider_closure_verified"] is False
          assert set(closure["module_imports"])=={name+".sys" for name in names}
          print("FIVE_MODULE_EVIDENCE_SET=PASS; FULL_CLOSURE=UNVERIFIED")
          PY
      - name: Publish bounded source-built PE evidence (NOT APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wine29-HID-XInput-Five-ARM64-PE-NOT-APK
          path: wine29-first-provider-candidate/
          if-no-files-found: error
          retention-days: 7
