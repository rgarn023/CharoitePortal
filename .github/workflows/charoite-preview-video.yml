name: Charoite Crystal C Portal Seven-Second Preview

on:
  push:
    branches: [main]
    paths:
      - 'docs/previews/render_crystal_awakening.py'
      - '.github/workflows/charoite-preview-video.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-preview:
    name: Generate 7-second glowing crystal C and black-purple portal
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare preview video renderer
        run: |
          python3 -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless imageio-ffmpeg
          python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
      - name: Render approved Charoite artwork motion concept
        run: |
          python3 docs/previews/render_crystal_awakening.py
          test -s Charoite_Crystal_Portal_7s.mp4
          python3 -c "import cv2; v=cv2.VideoCapture('Charoite_Crystal_Portal_7s.mp4'); assert v.isOpened(); fps=v.get(cv2.CAP_PROP_FPS); frames=v.get(cv2.CAP_PROP_FRAME_COUNT); assert abs(frames/fps-7)<.2, (frames,fps); print('PREVIEW_SEVEN_SECONDS_PASS')"
          sha256sum Charoite_Crystal_Portal_7s.mp4
      - name: Upload MP4 for direct GitHub download
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Crystal-Portal-7s-MP4
          path: |
            Charoite_Crystal_Portal_7s.mp4
            Charoite_Crystal_Portal_7s_Storyboard.jpg
          retention-days: 30
          if-no-files-found: error
