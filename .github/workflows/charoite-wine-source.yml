name: Charoite Wine ARM64EC source validation
on:
  push:
    paths:
      - '.github/workflows/charoite-wine-source.yml'
      - 'next-generation/charoite-wine/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charoite-wine-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-wine-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Charoite source and attribution
        uses: actions/checkout@v4

      - name: Validate preparation safety contract
        run: python3 -m unittest discover -s next-generation/charoite-wine/tests -p 'test_*.py' -v

      - name: Verify pinned Wine source plus ARM64EC/GE/Charoite patches
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/prepare-source.sh "$RUNNER_TEMP/charoite-wine-prepared"
          test -s "$RUNNER_TEMP/charoite-wine-prepared/charoite-source-validation.txt"
          test -s "$RUNNER_TEMP/charoite-wine-prepared/charoite-source-delta.patch"
          grep -F 'This is patched SOURCE' "$RUNNER_TEMP/charoite-wine-prepared/charoite-source-validation.txt"
          mkdir -p "$RUNNER_TEMP/charoite-source-report"
          cp "$RUNNER_TEMP/charoite-wine-prepared/charoite-source-validation.txt" "$RUNNER_TEMP/charoite-source-report/"
          cp "$RUNNER_TEMP/charoite-wine-prepared/charoite-prerequisite-order.txt" "$RUNNER_TEMP/charoite-source-report/"
          cp "$RUNNER_TEMP/charoite-wine-prepared/charoite-source-delta.patch" "$RUNNER_TEMP/charoite-source-report/"

      - name: Publish validated SOURCE provenance only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-Source-Validation
          path: ${{ runner.temp }}/charoite-source-report/
          retention-days: 14
          if-no-files-found: error

  smoke-build-host-wineserver:
    needs: validate-wine-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned patched Wine source without installing
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/prepare-source.sh "$RUNNER_TEMP/charoite-wine-prepared"

      - name: Compile patched Wine server for host-only ABI smoke check
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/smoke-build-host.sh "$RUNNER_TEMP/charoite-wine-prepared"
          test -s "$RUNNER_TEMP/charoite-wine-prepared/charoite-host-build-validation.txt"
          mkdir -p "$RUNNER_TEMP/charoite-host-report"
          cp "$RUNNER_TEMP/charoite-wine-prepared/charoite-host-build-validation.txt" "$RUNNER_TEMP/charoite-host-report/"

      - name: Publish Linux host compile report (not an Android runner)
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-Host-Build-Validation
          path: ${{ runner.temp }}/charoite-host-report/
          retention-days: 14
          if-no-files-found: error

  android-arm64-wineserver:
    needs: validate-wine-source
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Charoite Wine integration
        uses: actions/checkout@v4

      - name: Install pinned Android NDK for native ARM64 Wine
        uses: android-actions/setup-android@v4

      - name: Install Android NDK r27d (API 35, 16 KiB pages)
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.3.13750724'
          test -x "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

      - name: Prepare exact verified Charoite Wine source
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/prepare-source.sh "$RUNNER_TEMP/charoite-wine-prepared"

      - name: Cross-compile Android ARM64 Wine server and verify native ELF
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-android-arm64.sh \
            "$RUNNER_TEMP/charoite-wine-prepared" \
            "$ANDROID_HOME/ndk/27.3.13750724"
          test -s "$RUNNER_TEMP/charoite-wine-prepared/charoite-android-native-artifact/wineserver-arm64-android"
          grep -F 'Target: Android API 35' "$RUNNER_TEMP/charoite-wine-prepared/charoite-android-native-artifact/build-report.txt"

      - name: Publish experimental ARM64 wineserver, not a functional runner
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-Android-ARM64-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-android-native-artifact/
          retention-days: 14
          if-no-files-found: error

  android-arm64ec-ntdll:
    needs: validate-wine-source
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Pin Android NDK r27d
        uses: android-actions/setup-android@v4

      - name: Install native ARM64 NDK compiler
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.3.13750724'
          test -x "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

      - name: Download checksum-pinned LLVM-MinGW PE cross compiler
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/charoite-llvm-mingw-20261020.tar.xz"
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 25 --max-time 300 "$URL" -o "$ARCHIVE"
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  $ARCHIVE" | sha256sum --check
          mkdir "$RUNNER_TEMP/charoite-llvm-mingw"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/charoite-llvm-mingw" --strip-components=1
          "$RUNNER_TEMP/charoite-llvm-mingw/bin/clang" --version
          test -x "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj"

      - name: Prepare signed-off, pinned ARM64EC Wine source
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/prepare-source.sh "$RUNNER_TEMP/charoite-wine-prepared"

      - name: Cross-build ARM64EC PE plus Android native ntdll components
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-arm64ec-ntdll.sh \
            "$RUNNER_TEMP/charoite-wine-prepared" \
            "$ANDROID_HOME/ndk/27.3.13750724" \
            "$RUNNER_TEMP/charoite-llvm-mingw"
          test -s "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-artifact/ntdll-arm64ec.dll"
          test -s "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-artifact/ntdll-arm64-android.so"
          test -s "$RUNNER_TEMP/charoite-wine-prepared/charoite-wine-arm64ec-base-slice.tar.gz"
          test -s "$RUNNER_TEMP/charoite-wine-prepared/charoite-runtime-slice/manifest.json"
          grep -F 'CHAROITE_WINE_SLICE_ABI_CHECK=PASS' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-slice-validation.txt"
          python3 next-generation/charoite-wine/verify-runtime-slice.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-wine-arm64ec-base-slice.tar.gz"

      - name: Publish experimental ARM64EC ntdll pair only after ABI validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-ARM64EC-NTDLL-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-arm64ec-artifact/
          retention-days: 14
          if-no-files-found: error

      - name: Publish same-source ARM64EC loader/server/ntdll experimental slice
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-ARM64EC-Base-Slice-Experimental
          path: |
            ${{ runner.temp }}/charoite-wine-prepared/charoite-wine-arm64ec-base-slice.tar.gz
            ${{ runner.temp }}/charoite-wine-prepared/charoite-slice-validation.txt
            ${{ runner.temp }}/charoite-wine-prepared/charoite-runtime-slice/manifest.json
          retention-days: 14
          if-no-files-found: error

      - name: Cross-build core Windows ARM64EC kernel modules
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-kernel-bridge.sh \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-kernel-bridge"
          python3 next-generation/charoite-wine/verify-kernel-bridge.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-kernel-bridge"

      - name: Publish source-built ARM64EC kernelbase and kernel32 for independent review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-ARM64EC-Kernel-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-kernel-bridge/
          retention-days: 14
          if-no-files-found: error

      - name: Build experimental Windows ARM64 Wineboot
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-wineboot.sh \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-wineboot"
          python3 next-generation/charoite-wine/verify-wineboot.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-wineboot"

      - name: Publish source-built Windows ARM64 Wineboot (not executed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-ARM64-Wineboot-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-wineboot/
          retention-days: 14
          if-no-files-found: error

      - name: Audit Wine bootstrap Windows imports and Android ELF dependencies (no execution)
        run: |
          set -euo pipefail
          python3 next-generation/charoite-wine/audit-runtime-deps.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-dependency-inventory"
          grep -Fx 'CHAROITE_WINE_DEPENDENCY_AUDIT=PASS' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-dependency-inventory/runtime-dependency-inventory.txt"

      - name: Publish read-only Wine bootstrap dependency inventory (not a runnable engine)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-Bootstrap-Dependency-Audit
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-dependency-inventory/
          retention-days: 14
          if-no-files-found: error

      - name: Build Windows ARM64EC PE foundation from audited imports (experimental)
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-pe-foundation.sh \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-dependency-inventory/runtime-dependency-inventory.json" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-foundation"
          python3 next-generation/charoite-wine/verify-pe-foundation.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-foundation"

      - name: Publish experimental ARM64EC PE API foundation (not executable)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-ARM64EC-PE-Foundation-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-pe-foundation/
          retention-days: 14
          if-no-files-found: error

      - name: Cross-build audited Windows ARM64EC PE API expansion (experimental)
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-pe-expansion.sh \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-dependency-inventory/runtime-dependency-inventory.json" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-foundation" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-expansion"
          python3 next-generation/charoite-wine/verify-pe-expansion.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-expansion" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-foundation"

      - name: Publish ARM64EC PE API expansion (experimental, not runnable)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-ARM64EC-PE-Expansion-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-pe-expansion/
          retention-days: 14
          if-no-files-found: error

      - name: Assemble and audit one coherent Wine bootstrap archive (non-runnable)
        run: |
          set -euo pipefail
          python3 next-generation/charoite-wine/assemble-bootstrap-bundle.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-bundle"
          python3 next-generation/charoite-wine/verify-bootstrap-bundle.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-bundle/charoite-wine-bootstrap-bundle.tar.gz"
          grep -Fx 'CHAROITE_WINE_COHERENT_BOOTSTRAP_ASSEMBLED=PASS' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-bundle/bundle-report.txt"
          grep -Fx 'NLS_COUNT=76' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-bundle/bundle-report.txt"
          grep -Fx 'LAUNCH_READY=false' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-bundle/bundle-report.txt"

      - name: Publish coherent Wine bootstrap and import-gap report (NOT installable)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-Coherent-Bootstrap-NLS-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-bootstrap-bundle/
          retention-days: 14
          if-no-files-found: error

      - name: Cross-build four measured ARM64EC Windows startup APIs (non-runnable)
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-pe-startup.sh \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-bundle/dependency-review.json" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-startup"
          python3 next-generation/charoite-wine/verify-pe-startup.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-startup" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-bundle/dependency-review.json"

      - name: Publish experimental ARM64EC Windows startup API module bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-ARM64EC-PE-Startup-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-pe-startup/
          retention-days: 14
          if-no-files-found: error

      - name: Assemble source-verified 18-component Wine/NLS bootstrap (not runnable)
        run: |
          set -euo pipefail
          python3 next-generation/charoite-wine/assemble-bootstrap-bundle.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-extended" \
            --include-startup
          python3 next-generation/charoite-wine/verify-bootstrap-bundle.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-extended/charoite-wine-bootstrap-bundle.tar.gz"
          grep -Fx 'COMPONENTS=18' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-extended/bundle-report.txt"
          grep -Fx 'NLS_COUNT=76' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-extended/bundle-report.txt"
          grep -Fx 'LAUNCH_READY=false' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-extended/bundle-report.txt"

      - name: Publish coherent 18-component Wine/NLS experimental archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-Coherent-Bootstrap-18-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-bootstrap-extended/
          retention-days: 14
          if-no-files-found: error

      - name: Cross-build audited ARM64EC RPC COM and common control APIs (non-runnable)
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-pe-com.sh \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-extended/dependency-review.json" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-com"
          python3 next-generation/charoite-wine/verify-pe-com.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-com" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-extended/dependency-review.json"

      - name: Publish experimental ARM64EC RPC COM and controls bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-ARM64EC-PE-COM-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-pe-com/
          retention-days: 14
          if-no-files-found: error

      - name: Assemble and audit 22 source-matched Wine components with all NLS tables
        run: |
          set -euo pipefail
          python3 next-generation/charoite-wine/assemble-bootstrap-bundle.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-com-extended" \
            --include-com
          python3 next-generation/charoite-wine/verify-bootstrap-bundle.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-com-extended/charoite-wine-bootstrap-bundle.tar.gz"
          grep -Fx 'COMPONENTS=22' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-com-extended/bundle-report.txt"
          grep -Fx 'NLS_COUNT=76' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-com-extended/bundle-report.txt"
          grep -Fx 'LAUNCH_READY=false' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-com-extended/bundle-report.txt"

      - name: Publish verified 22-component Wine/NLS bootstrap (NOT installable)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-Coherent-Bootstrap-22-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-bootstrap-com-extended/
          retention-days: 14
          if-no-files-found: error

      - name: Compile four missing ARM64EC security and C runtime Wine PE modules (CI only)
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-pe-services.sh \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-com-extended/dependency-review.json" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-services"
          python3 next-generation/charoite-wine/verify-pe-services.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-pe-services" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-com-extended/dependency-review.json"

      - name: Publish source-audited PE services (not installable)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-ARM64EC-PE-Security-Services-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-pe-services/
          retention-days: 14
          if-no-files-found: error

      - name: Assemble 26-component Wine/bootstrap security gap inventory (not runnable)
        run: |
          set -euo pipefail
          python3 next-generation/charoite-wine/assemble-bootstrap-bundle.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-services-extended" \
            --include-services
          python3 next-generation/charoite-wine/verify-bootstrap-bundle.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-services-extended/charoite-wine-bootstrap-bundle.tar.gz"
          grep -Fx 'COMPONENTS=26' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-services-extended/bundle-report.txt"
          grep -Fx 'NLS_COUNT=76' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-services-extended/bundle-report.txt"
          grep -Fx 'LAUNCH_READY=false' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-services-extended/bundle-report.txt"

      - name: Publish source-audited 26-component Wine/NLS archive (NOT installable)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-Coherent-Bootstrap-26-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-bootstrap-services-extended/
          retention-days: 14
          if-no-files-found: error

      - name: Compile original Wine10 ARM64 API-set data module (CI source only)
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-apiset-bootstrap.sh \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-apiset-schema"
          python3 next-generation/charoite-wine/verify-apiset-bootstrap.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-apiset-schema"

      - name: Publish API-set source proof only, not an installable runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-APISet-Schema-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-apiset-schema/
          retention-days: 14
          if-no-files-found: error

      - name: Assemble independently verified 27-component Wine/API-set archive (data only)
        run: |
          set -euo pipefail
          python3 next-generation/charoite-wine/assemble-bootstrap-bundle.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-arm64ec-android" \
            "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-apiset-extended" \
            --include-apiset
          python3 next-generation/charoite-wine/verify-bootstrap-bundle.py \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-apiset-extended/charoite-wine-bootstrap-bundle.tar.gz"
          grep -Fx 'COMPONENTS=27' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-apiset-extended/bundle-report.txt"
          grep -Fx 'NLS_COUNT=76' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-apiset-extended/bundle-report.txt"
          grep -Fx 'LAUNCH_READY=false' \
            "$RUNNER_TEMP/charoite-wine-prepared/charoite-bootstrap-apiset-extended/bundle-report.txt"

      - name: Publish 27-component Wine/API-set verified archive (NOT an APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine-Coherent-Bootstrap-27-APISet-Experimental
          path: ${{ runner.temp }}/charoite-wine-prepared/charoite-bootstrap-apiset-extended/
          retention-days: 14
          if-no-files-found: error

  # Separate source validation ONLY; the frozen Wine29 .0.6 archive is unchanged.
  verify-isolated-wine29-native-source:
    needs: validate-wine-source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Test Wine29 native source patch isolation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s next-generation/charoite-wine/tests \
            -p 'test_wine29_native_*.py' -v

      - name: Independently patch a NEW source tree without changing Wine28
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/prepare-source.sh \
            "$RUNNER_TEMP/charoite-wine29-isolated"
          python3 next-generation/charoite-wine/prepare-wine29-native.py \
            "$RUNNER_TEMP/charoite-wine29-isolated"
          ( cd "$RUNNER_TEMP/charoite-wine29-isolated" && git diff --check )
          python3 - "$RUNNER_TEMP/charoite-wine29-isolated" <<'PY'
          import json
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          report=json.loads((root/"charoite-wine29-native-source-validation.json").read_text())
          assert report["generation"]=="wine10-arm64ec-bootstrap.0.7"
          assert report["source_commit"]=="c74acb09d51b447f5d5ac56c87608d3ec565a767"
          assert report["runtime_executable"] is False
          assert report["native_elf_installed"] is False
          assert set(report["patch_sources"])=={
              "loader/main.c","dlls/ntdll/unix/loader.c","server/unicode.c"}
          for name in report["patch_sources"]:
              assert report["patch_sources"][name]["before_sha256"]!=report["patch_sources"][name]["after_sha256"]
          delta=(root/"charoite-wine29-native-source-delta.patch").read_bytes()
          for marker in (b"CHAROITE_WINE29_NATIVE_DIR",b"CHAROITE_WINE29_PE_DIR",
                         b"CHAROITE_WINE29_DATA_DIR",b"Wine29/Wine28 selector conflict",
                         b"libcharoite_wine29_ntdll.so"):
              assert marker in delta
          print("CHAROITE_WINE29_NATIVE_GENERATION_SOURCE_GATE=PASS")
          print("WINE29_NATIVE_APK_INSTALLED=false")
          print("WINEBOOT_EXECUTED=false")
          PY

      - name: Publish isolated Wine29 C source delta, not executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine29-Native-Source-Isolation
          path: |
            ${{ runner.temp }}/charoite-wine29-isolated/charoite-wine29-native-source-validation.json
            ${{ runner.temp }}/charoite-wine29-isolated/charoite-wine29-native-source-delta.patch
          retention-days: 14
          if-no-files-found: error

  # The first separately compiled Wine29 .0.7 native generation: CI ONLY.
  # No old APK, prefix, data archive, phone or previous Wine28 scratch touched.
  build-isolated-wine29-native:
    needs: verify-isolated-wine29-native-source
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout pinned Charoite build scripts
        uses: actions/checkout@v4

      - name: Verify compiled-native proof rules before any build
        run: |
          set -euo pipefail
          python3 -m unittest discover -s next-generation/charoite-wine/tests \
            -p 'test_wine29_native_compile.py' -v

      - name: Install Android NDK r27d and pinned LLVM MinGW for ARM64EC
        uses: android-actions/setup-android@v4

      - name: Fetch and verify exact toolchain binaries
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.3.13750724'
          test -x "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          ARCHIVE="$RUNNER_TEMP/charoite-llvm-mingw-20261020.tar.xz"
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 25 --max-time 300 "$URL" -o "$ARCHIVE"
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  $ARCHIVE" | sha256sum --check
          mkdir "$RUNNER_TEMP/charoite-llvm-mingw"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/charoite-llvm-mingw" --strip-components=1
          test -x "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj"

      - name: Prepare DIFFERENT pinned Wine29 native source tree
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/prepare-source.sh \
            "$RUNNER_TEMP/charoite-wine29-native-build"
          python3 next-generation/charoite-wine/prepare-wine29-native.py \
            "$RUNNER_TEMP/charoite-wine29-native-build"
          grep -Fq 'CHAROITE_WINE29_NATIVE_DIR' \
            "$RUNNER_TEMP/charoite-wine29-native-build/loader/main.c"
          grep -Fq 'CHAROITE_WINE29_PE_DIR' \
            "$RUNNER_TEMP/charoite-wine29-native-build/dlls/ntdll/unix/loader.c"
          grep -Fq 'CHAROITE_WINE29_DATA_DIR' \
            "$RUNNER_TEMP/charoite-wine29-native-build/server/unicode.c"

      - name: Cross-compile the matching ARM64 Wine loader, wineserver and NTDLL plus ARM64EC Windows NTDLL
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-arm64ec-ntdll.sh \
            "$RUNNER_TEMP/charoite-wine29-native-build" \
            "$ANDROID_HOME/ndk/27.3.13750724" \
            "$RUNNER_TEMP/charoite-llvm-mingw"
          test -s "$RUNNER_TEMP/charoite-wine29-native-build/charoite-arm64ec-android/loader/wine"
          test -s "$RUNNER_TEMP/charoite-wine29-native-build/charoite-arm64ec-android/server/wineserver"
          test -s "$RUNNER_TEMP/charoite-wine29-native-build/charoite-arm64ec-android/dlls/ntdll/ntdll.so"

      - name: Seal audited Wine29 .0.7 NATIVE COMPILE PROOF (no Wine execution)
        run: |
          set -euo pipefail
          python3 next-generation/charoite-wine/verify-wine29-native-compile.py \
            "$RUNNER_TEMP/charoite-wine29-native-build" \
            "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" \
            "$RUNNER_TEMP/charoite-wine29-native-compile-proof"
          grep -Fq '"source_generation": "wine10-arm64ec-bootstrap.0.7"' \
            "$RUNNER_TEMP/charoite-wine29-native-compile-proof/native-compile-report.json"
          grep -Fq '"native_elf_installed": false' \
            "$RUNNER_TEMP/charoite-wine29-native-compile-proof/native-compile-report.json"
          grep -Fq '"new_27_component_archive_verified": false' \
            "$RUNNER_TEMP/charoite-wine29-native-compile-proof/native-compile-report.json"

      - name: Publish verified Wine29 compile-only native slice, NOT a runnable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine29-Isolated-Native-Compile-Experimental
          path: ${{ runner.temp }}/charoite-wine29-native-compile-proof/
          retention-days: 14
          if-no-files-found: error
