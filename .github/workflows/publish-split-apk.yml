name: Publish split Charoite APK fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-split-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-released-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified original GitHub release APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download charoite-portal-gdi-charset-v2 \
            --repo "$GH_REPO" \
            --pattern 'Charoite-Portal-GDI-Charset-Test-v2.apk' \
            --dir input
          echo '2cb7b52d87640bd24eed72d3441a34ae6f5c71907ba9f9d6b5461b1b06693931  input/Charoite-Portal-GDI-Charset-Test-v2.apk' | sha256sum -c -

      - name: Build and verify standard multipart ZIP archive
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          apk=Path("input/Charoite-Portal-GDI-Charset-Test-v2.apk")
          archive=Path("dist/Charoite-Portal-Charset-v2-Multipart.zip")
          with ZipFile(archive, "w", compression=ZIP_STORED, allowZip64=True) as z:
              z.write(apk, arcname=apk.name)
          PY
          split -b 40m -d -a 3 --numeric-suffixes=1 \
            dist/Charoite-Portal-Charset-v2-Multipart.zip \
            dist/Charoite-Portal-Charset-v2-Multipart.zip.
          test "$(find dist -name 'Charoite-Portal-Charset-v2-Multipart.zip.*' | wc -l)" -ge 4
          cat dist/Charoite-Portal-Charset-v2-Multipart.zip.* > dist/rejoined.zip
          cmp dist/Charoite-Portal-Charset-v2-Multipart.zip dist/rejoined.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          from hashlib import sha256
          apk="Charoite-Portal-GDI-Charset-Test-v2.apk"
          with ZipFile("dist/rejoined.zip") as z:
              assert z.namelist() == [apk]
              with z.open(apk) as f:
                  d=sha256()
                  while chunk := f.read(1024*1024): d.update(chunk)
          assert d.hexdigest() == "2cb7b52d87640bd24eed72d3441a34ae6f5c71907ba9f9d6b5461b1b06693931"
          print("Split ZIP and original APK verified:", d.hexdigest())
          PY
          rm dist/Charoite-Portal-Charset-v2-Multipart.zip dist/rejoined.zip
          ls -lh dist/

      - name: Publish download parts to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=charoite-portal-gdi-charset-v2
          if gh release view "$TAG" --repo "$GH_REPO" --json assets \
             --jq '.assets[].name' | grep -q '^Charoite-Portal-Charset-v2-Multipart'; then
            echo "Split assets already exist; refusing to overwrite."
            exit 1
          fi
          gh release upload "$TAG" dist/Charoite-Portal-Charset-v2-Multipart.zip.* --repo "$GH_REPO"
          gh release view "$TAG" --repo "$GH_REPO" --json assets \
            --jq '.assets[].name' | grep -F 'Charoite-Portal-Charset-v2-Multipart'
          cat > /tmp/release-notes.md <<'EOF'
          The official signed Charoite Portal APK includes a Japanese owner-drawn font charset diagnostic. The diagnostic does not modify Wine or user games.

          Normal download: Charoite-Portal-GDI-Charset-Test-v2.apk.

          Smaller-download fallback: Download ALL six parts named Charoite-Portal-Charset-v2-Multipart.zip.001 through .006 to the same Downloads folder. In ZArchiver (https://play.google.com/store/apps/details?id=ru.zdevs.zarchiver), select the first .zip.001 part and extract. It reconstructs Charoite-Portal-GDI-Charset-Test-v2.apk. Do not rename the parts. The reconstructed APK SHA-256 is 2cb7b52d87640bd24eed72d3441a34ae6f5c71907ba9f9d6b5461b1b06693931.

          Do not uninstall the existing Charoite Portal or clear app data if Android rejects an APK update due to a different signing certificate.
          EOF
          gh release edit "$TAG" --repo "$GH_REPO" --notes-file /tmp/release-notes.md
