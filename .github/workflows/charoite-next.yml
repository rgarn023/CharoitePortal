            upstream/app/build/outputs/apk/debug/Charoite-Next-Android.apk
          test -s upstream/app/build/outputs/apk/debug/Charoite-Next-Android.apk

      - name: Upload Charoite Next APK
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Core-Next-Android-APK
          path: upstream/app/build/outputs/apk/debug/Charoite-Next-Android.apk
          if-no-files-found: error

      - name: Publish Charoite Next source attribution
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Core-Next-Licenses
          path: legal-bundle/
          if-no-files-found: error

      - name: Publish connector-readable APK build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          if [ "$BUILD_RESULT" = "success" ]; then
            state=success
            message="Charoite Next APK uploaded; inspect workflow artifacts"
          else
            state=failure
            message="Charoite Next APK build failed; inspect job logs"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=charoite-next-apk \
            -f description="$message" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "::warning::Unable to publish result; inspect workflow directly."

