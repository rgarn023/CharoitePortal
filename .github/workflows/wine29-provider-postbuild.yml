name: Wine29 Provider Postbuild
on:
  workflow_run:
    workflows: ['Wine29 Missing Provider ARM64 PE Cross-Build (No APK)']
    types: [completed]
permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: ${{ github.repository == 'rgarn023/CharoitePortal' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/wine29-first-provider-crossbuild.yml' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect completed build artifact without executing it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          echo "## Wine29 source-only postbuild verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream: https://github.com/$REPO/actions/runs/$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Conclusion: $CONCLUSION" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CONCLUSION" != success ]; then
            echo "Upstream not successful; inspect upstream job logs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python3 - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))["artifacts"]
          hits=[x for x in a if x["name"]=="Wine29-HID-XInput-Five-ARM64-PE-NOT-APK" and not x["expired"]]
          assert len(hits)==1, "Expected exactly one unexpired five-module artifact"
          assert 0<hits[0]["size_in_bytes"]<20*1024*1024, "Artifact size cap exceeded"
          with open(sys.argv[1]+".id","w") as f: f.write(str(hits[0]["id"]))
          PY
          ARTIFACT_ID="$(cat "$RUNNER_TEMP/artifacts.json.id")"
          # gh run download uses GitHub's supported artifact transport and extracts safely.
          mkdir "$RUNNER_TEMP/evidence"
          gh run download "$RUN_ID" --repo "$REPO" --name Wine29-HID-XInput-Five-ARM64-PE-NOT-APK --dir "$RUNNER_TEMP/evidence"
          test "$(find "$RUNNER_TEMP/evidence" -type f | wc -l)" -lt 70
          test ! -L "$RUNNER_TEMP/evidence"
          python3 - "$RUNNER_TEMP/evidence" <<'PY'
          import hashlib,json,os,pathlib,struct,sys
          names=("mouhid","hidclass","hidparse","winehid","winexinput")
          root=pathlib.Path(sys.argv[1])
          entries=list(root.iterdir())
          assert len(entries)<70 and all(p.is_file() and not p.is_symlink() for p in entries)
          assert sum(p.stat().st_size for p in entries)<40*1024*1024
          assert all(p.stat().st_size<32*1024*1024 for p in entries)
          members={p.name for p in entries}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
            out.write("| Module | ARM64 PE and manifest integrity |\n| --- | --- |\n")
            for name in names:
              binary=name+"-arm64.sys"
              manifest=name+"-manifest.json"
              assert binary in members and manifest in members
              data=(root/binary).read_bytes(); m=json.loads((root/manifest).read_bytes())
              assert 1024<len(data)<32*1024*1024 and data[:2]==b"MZ"
              off=struct.unpack_from("<I",data,0x3c)[0]
              assert 64<=off<len(data)-24 and data[off:off+4]==b"PE\x00\x00"
              assert struct.unpack_from("<H",data,off+4)[0]==0xaa64
              assert hashlib.sha256(data).hexdigest()==m["sha256"]
              assert m["module"]==name+".sys"
              assert m["machine"]=="0xAA64" and m["source_commit"]=="c74acb09d51b447f5d5ac56c87608d3ec565a767"
              assert m["bytes"]==len(data) and m["pe_compilation_verified"] is True
              assert m["wine_executed"] is False and m["phone_tested"] is False
              assert m["native_companion_closure_verified"] is False
              assert m["runtime_compatibility_verified"] is False
              assert m["provider_import_closure_verified"] is False
              out.write(f"| {name}.sys | PASS |\n")
            assert "batch-import-closure.json" in members
            report=json.loads((root/"batch-import-closure.json").read_bytes())
            assert report["full_provider_closure_verified"] is False
            assert set(report["module_imports"])=={n+".sys" for n in names}
            assert report["native_companion_closure_verified"] is False
            assert report["runtime_compatibility_verified"] is False
            for name in names:
              manifest=json.loads((root/(name+"-manifest.json")).read_bytes())
              imports=set(manifest["ordinary_imports"]+manifest["delay_imports"])
              details=report["module_imports"][name+".sys"]
              assert set(details["batch_resolved"]).isdisjoint(details["external_unverified"])
              assert set(details["batch_resolved"]+details["external_unverified"])==imports
            out.write("\nFull dependency closure and runtime compatibility NOT verified.\n")
          PY

  signal-development:
    needs: verify
    if: ${{ always() && github.repository == 'rgarn023/CharoitePortal' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/wine29-first-provider-crossbuild.yml' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: charoite-pr9-completion-signal
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Signal a new main cross-build on the coordination PR
        uses: actions/github-script@v7
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const repository = owner + '/' + repo;
            const pull = 9;
            const branch = 'automation/charoite-continuous-development';
            const upstream = context.payload.workflow_run;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: upstream.id});
            if (run.repository.full_name !== repository || run.repository.private !== false ||
                run.head_repository?.full_name !== repository || run.head_branch !== 'main' ||
                run.path !== '.github/workflows/wine29-first-provider-crossbuild.yml' ||
                !['push', 'workflow_dispatch'].includes(run.event) || run.status !== 'completed' ||
                run.head_sha !== upstream.head_sha || run.run_attempt !== upstream.run_attempt) {
              throw new Error('Upstream run identity or attempt changed');
            }
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: pull});
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.head.ref !== branch || pr.head.repo?.full_name !== repository) {
              throw new Error('Coordination PR unavailable; hourly task recovers the completion');
            }
            const {data: file} = await github.rest.repos.getContent({
              owner, repo, path: '.github/automation/development-state.json', ref: branch
            });
            const ledger = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const batch = ledger.event_batch_utc;
            const opened = Date.parse(batch + ':00:00.000Z');
            const age = Date.now() - opened;
            if (!Number.isFinite(age) || age < 0 || age >= 3 * 60 * 60 * 1000) {
              core.notice('Hourly task will recover this run and open the next batch.');
              return;
            }
            if (ledger.processed_run_ids.includes(run.id)) {
              core.info('Completion already processed by a worker.');
              return;
            }
            const marker = '<!-- charoite-build-completed:' + run.id + ' -->';
            const batchMarker = '<!-- charoite-event-batch:' + batch + ' -->';
            const batchStart = batch + ':00:00.000Z';
            const since = new Date(Math.min(Date.parse(run.created_at), Date.parse(batchStart))).toISOString();
            let signalled = 0;
            for await (const page of github.paginate.iterator(github.rest.issues.listComments,
                {owner, repo, issue_number: pull, since, per_page: 100})) {
              for (const comment of page.data) {
                if (comment.user?.login !== 'github-actions[bot]') continue;
                const lines = (comment.body || '').split('\n');
                if (lines.includes(marker)) {
                  core.info('Completion already signalled.');
                  return;
                }
                if (lines[0] === 'CHAROITE_BUILD_COMPLETED_V1' && lines.includes(batchMarker)) signalled++;
              }
            }
            if (signalled >= 1) {
              core.notice('One completion already signalled in this three-hour batch. Hourly task will resume pending work.');
              return;
            }
            const body = ['CHAROITE_BUILD_COMPLETED_V1', marker, batchMarker,
              JSON.stringify({run_id: run.id, run_attempt: run.run_attempt, sha: run.head_sha,
                conclusion: run.conclusion, postbuild: process.env.VERIFY_RESULT, url: run.html_url}),
              'Inspect job logs and artifacts before claiming progress. This cross-build produces no APK.'
            ].join('\n');
            const {data: comment} = await github.rest.issues.createComment({owner, repo, issue_number: pull, body});
            core.info('Signalled completion: ' + comment.html_url);
