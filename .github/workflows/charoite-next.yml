name: Charoite Core Next Android
on:
  push:
    paths:
      - '.github/workflows/charoite-next.yml'
      - 'next-generation/**'
      - '!next-generation/charoite-wine/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: charoite-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      # Expose the real push run ID through GitHub commit status API.
      # This makes the workflow run discoverable from the connected GitHub tools.
      - name: Publish discoverable APK build run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=charoite-next-apk \
            -f description="Charoite Next APK build in progress" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "::warning::Unable to publish build run status; APK CI still proceeds."

      - name: Verify game folder import never auto-launches
        run: python3 -m unittest discover -s runtime-preview/tests -p 'test_*.py' -v

      - name: Install image processing tools for Next-only splash art
        run: python3 -m pip install --user --break-system-packages --disable-pip-version-check Pillow==11.3.0 numpy opencv-python-headless imageio-ffmpeg

      - name: Verify Next multi-engine isolation tests
        run: python3 -m unittest discover -s next-generation/tests -p 'test_*.py' -v

      - name: Get pinned LGPL Winlator upstream source
        run: |
          git clone --filter=blob:none --depth 1 https://github.com/brunodev85/winlator-app.git upstream
          cd upstream
          git fetch --depth 1 origin 8077f374ef2d54127b088de9e8cd7b4af14d9c8b
          git checkout --detach 8077f374ef2d54127b088de9e8cd7b4af14d9c8b
          test -f LICENSE
          test -f app/src/main/assets/rootfs.tzst

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install build dependencies
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'

      - name: Rebase embedded Box64 and Wine native paths
        run: |
          command -v zstd
          python3 next-generation/rewrite_prefix_next.py upstream

      - name: Verify Box64 points to this app's private loader
        run: |
          mkdir -p /tmp/touhou-elf-check
          tar --use-compress-program=zstd -xf upstream/app/src/main/assets/box64/box64-0.4.4.tzst -C /tmp/touhou-elf-check ./usr/local/bin/box64
          python3 - <<'PY'
          from pathlib import Path
          box64 = Path('/tmp/touhou-elf-check/usr/local/bin/box64').read_bytes()
          assert b'/data/data/com.charoitx/files/rootfs/lib/ld-linux-aarch64.so.1' in box64
          assert b'/data/data/com.winlator/' not in box64
          assert b'/data/data/com.touhoudr/' not in box64
          assert b'/data/data/com.charoitx/' in box64
          assert b'/data/data/com.charoite/' not in box64
          print('Box64 loader uses the separate Charoite Next private application data path.')
          PY

      - name: Build licensed Japanese language support pack
        run: |
          command -v localedef
          command -v fc-scan
          python3 runtime-preview/charoite-core/japanese/build_japanese_support.py upstream

      - name: Restore compiled Japanese installer helpers
        id: japanese-helper-cache
        uses: actions/cache@v4
        with:
          path: |
            runtime-preview/charoite-core/japanese/touhou_probe.exe
            runtime-preview/charoite-core/japanese/touhou_font_hook32.dll
            runtime-preview/charoite-core/japanese/touhou_font_hook64.dll
            runtime-preview/charoite-core/japanese/touhou_font_helper32.exe
            runtime-preview/charoite-core/japanese/touhou_font_helper64.exe
            runtime-preview/charoite-core/rendering/charoite_gdi_probe32.exe
            runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe32.exe
            runtime-preview/charoite-core/input/charoite_keyscan.exe
            runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.exe
          key: charoite-win32-tools-v5-${{ hashFiles('runtime-preview/charoite-core/japanese/touhou_probe.c', 'runtime-preview/charoite-core/japanese/touhou_font_hook.c', 'runtime-preview/charoite-core/japanese/touhou_font_helper.c', 'runtime-preview/charoite-core/rendering/charoite_gdi_probe.c', 'runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe.c', 'runtime-preview/charoite-core/input/charoite_keyscan.c', 'runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.c') }}

      - name: Compile Japanese installer font helpers
        if: steps.japanese-helper-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          # Ubuntu's Azure apt mirror stalled on 120 MB of MinGW packages
          # (exit code 124). Download a pinned, verified LLVM-MinGW toolchain.
          TOOLCHAIN=/tmp/charoite-llvm-mingw
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-msvcrt-ubuntu-22.04-x86_64.tar.xz"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 25 --max-time 240 \
            "$URL" -o /tmp/charoite-llvm-mingw.tar.xz
          echo "ceb8c5acc6f76e143f9c714772d2fa677027802561ce68c396e8dc990a80f0b6  /tmp/charoite-llvm-mingw.tar.xz" | sha256sum --check
          mkdir -p "$TOOLCHAIN"
          tar -xJf /tmp/charoite-llvm-mingw.tar.xz -C "$TOOLCHAIN" --strip-components=1
          CC32="$TOOLCHAIN/bin/i686-w64-mingw32-clang"
          CC64="$TOOLCHAIN/bin/x86_64-w64-mingw32-clang"
          test -x "$CC32" && test -x "$CC64"
          "$CC64" -std=c11 -O2 -Wall -Wextra -municode -mwindows \
            runtime-preview/charoite-core/japanese/touhou_probe.c -o runtime-preview/charoite-core/japanese/touhou_probe.exe \
            -luser32 -lgdi32
          for arch in 32 64; do
            if [ "$arch" = 32 ]; then cc="$CC32"; else cc="$CC64"; fi
            "$cc" -std=c11 -O2 -Wall -Wextra -shared \
              runtime-preview/charoite-core/japanese/touhou_font_hook.c \
              -o "runtime-preview/charoite-core/japanese/touhou_font_hook${arch}.dll" \
              -luser32 -lgdi32
            "$cc" -std=c11 -O2 -Wall -Wextra -municode -mwindows \
              runtime-preview/charoite-core/japanese/touhou_font_helper.c \
              -o "runtime-preview/charoite-core/japanese/touhou_font_helper${arch}.exe" \
              -luser32
            file "runtime-preview/charoite-core/japanese/touhou_font_hook${arch}.dll" "runtime-preview/charoite-core/japanese/touhou_font_helper${arch}.exe"
            # Fail CI if callback decoration drifts from the helper lookup.
            if [ "$arch" = 32 ]; then symbol="TouhouDrawHook@12"; else symbol="TouhouDrawHook"; fi
            objdump -p "runtime-preview/charoite-core/japanese/touhou_font_hook${arch}.dll" |
              grep -F " $symbol"
            # Verify the new native, pre-draw, read-only audit is exported
            # with the correct LLVM-MinGW x86/x64 decoration.
            if [ "$arch" = 32 ]; then audit="TouhouAuditHook@12"; else audit="TouhouAuditHook"; fi
            objdump -p "runtime-preview/charoite-core/japanese/touhou_font_hook${arch}.dll" |
              grep -F " $audit"
            test $(stat -c %s "runtime-preview/charoite-core/japanese/touhou_font_hook${arch}.dll") -gt 5000
            test $(stat -c %s "runtime-preview/charoite-core/japanese/touhou_font_helper${arch}.exe") -gt 5000
          done
          file runtime-preview/charoite-core/japanese/touhou_probe.exe
          test $(stat -c %s runtime-preview/charoite-core/japanese/touhou_probe.exe) -gt 10000
          # Shared read-only Unicode/CP932 test tool, deliberately not a Wine patch.
          "$CC32" -std=c11 -O2 -Wall -Wextra -municode -mwindows \
            runtime-preview/charoite-core/rendering/charoite_gdi_probe.c \
            -o runtime-preview/charoite-core/rendering/charoite_gdi_probe32.exe \
            -luser32 -lgdi32
          file runtime-preview/charoite-core/rendering/charoite_gdi_probe32.exe
          test $(stat -c %s runtime-preview/charoite-core/rendering/charoite_gdi_probe32.exe) -gt 10000
          "$CC32" -std=c11 -O2 -Wall -Wextra -municode -mwindows \
            runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe.c \
            -o runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe32.exe \
            -luser32 -lgdi32
          file runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe32.exe
          test $(stat -c %s runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe32.exe) -gt 10000
          # Keyboard scan-code helper is a small Windows executable.
          "$CC32" -std=c11 -O2 -Wall -Wextra -mwindows \
            runtime-preview/charoite-core/input/charoite_keyscan.c \
            -o runtime-preview/charoite-core/input/charoite_keyscan.exe \
            -lws2_32 -luser32
          test $(stat -c %s runtime-preview/charoite-core/input/charoite_keyscan.exe) -gt 5000
          # Standalone Win32-only, read-only Battle.net DNS/HTTPS/Agent probe.
          "$CC32" -std=c11 -O2 -Wall -Wextra -mwindows \
            runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.c \
            -o runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.exe \
            -lwinhttp -lws2_32 -luser32 -ladvapi32 -liphlpapi
          file runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.exe
          test $(stat -c %s runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.exe) -gt 5000

      - name: Apply stable Charoite Core feature overlay
        run: python3 runtime-preview/overlay.py upstream

      - name: Install separate Charoite Next app identity and engine inventory
        run: python3 next-generation/prepare_next.py upstream

      - name: Stage exact verified Wine PE binaries for read-only device diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charoite-wine-phone-probe/foundation" "$RUNNER_TEMP/charoite-wine-phone-probe/expansion"
          gh run download 40791083178 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine-ARM64EC-PE-Foundation-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine-phone-probe/foundation"
          gh run download 40791083178 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine-ARM64EC-PE-Expansion-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine-phone-probe/expansion"
          python3 next-generation/stage_wine_probe.py \
            "$RUNNER_TEMP/charoite-wine-phone-probe/foundation" \
            "$RUNNER_TEMP/charoite-wine-phone-probe/expansion" \
            upstream

      - name: Stage exact source-built Wine Android ELF for user-initiated --version smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charoite-wine-native-probe"
          gh run download 40898982875 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine-Coherent-Bootstrap-22-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine-native-probe"
          python3 next-generation/stage_native_wine_loader.py \
            "$RUNNER_TEMP/charoite-wine-native-probe/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/jniLibs/arm64-v8a/libcharoite_wine_loader.so
          test -s upstream/app/src/main/jniLibs/arm64-v8a/libcharoite_wine_ntdll.so
          test -s upstream/app/src/main/jniLibs/arm64-v8a/libcharoite_wineserver.so
          echo "Wine ELF staged ONLY for native Android --version, not as a gaming runtime."

      - name: Bundle all 22 audited Wine components and 76 NLS tables as inert Next APK assets
        run: |
          set -euo pipefail
          python3 next-generation/stage_bootstrap_payload.py \
            "$RUNNER_TEMP/charoite-wine-native-probe/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-22.bundle
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-payload.json
          echo "Wine bootstrap archive is an immutable APK asset, NOT an installed runtime."

      # Persist the one debug signing key used by Gradle for future APK
      # upgrades. actions/cache does not save nonexistent files, so create
      # the key BEFORE invoking Gradle (previous builds missed this step).
      # This cannot retroactively match earlier ephemeral APK certificates.
      - name: Restore Charoite Next APK signing identity
        id: signing-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/charoite-next.keystore
          key: charoite-next-debug-signing-v1

      - name: Create signing key on first build only
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/charoite-next.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/charoite-next.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android \
              -dname "CN=Charoite Next Debug,O=Charoite Games,C=US"
          fi
          test -s "$HOME/.android/charoite-next.keystore"
          keytool -list -keystore "$HOME/.android/charoite-next.keystore" \
            -alias androiddebugkey -storepass android > /dev/null
          echo "Signing key present before Android build."


      - name: Build integrated Windows runtime preview
        working-directory: upstream
        run: gradle --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2 assembleDebug

      - name: Verify seven source-built PE diagnostic DLLs in final APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, json, hashlib, struct
          apk=Path("upstream/app/build/outputs/apk/debug/app-debug.apk")
          prefix="assets/charoite-next/wine-ci/"
          with zipfile.ZipFile(apk) as archive:
              index=json.loads(archive.read(prefix+"wine-ci-evidence.json"))
              assert index["android_package"]=="com.charoitx"
              assert index["source_run"]==40791083178
              assert index["source_code_sha"]=="c1658e2d20260ff413e6ba6c47f460e2d5e7cec1"
              assert index["launch_ready"] is False
              assert index["installable_as_runtime"] is False
              assert index["anti_cheat_supported"] is False
              assert set(index["components"])=={
                  "advapi32","user32","ws2_32","crypt32","setupapi","shlwapi","version"}
              for name,info in index["components"].items():
                  archive_path="assets/"+info["asset"]
                  data=archive.read(archive_path)
                  assert len(data)==info["size"]
                  assert hashlib.sha256(data).hexdigest()==info["sha256"]
                  assert data[:2]==b"MZ"
                  pe=struct.unpack_from("<I",data,0x3c)[0]
                  assert data[pe:pe+4]==b"PE\x00\x00"
                  assert struct.unpack_from("<H",data,pe+4)[0]==0xAA64
                  print(name,"APK hash and ARM64 carrier verified")
              print("CHAROITE_NEXT_APK_DIAGNOSTIC_ASSET_VERIFIED=PASS")
          PY

      - name: Verify C-edge-fed reference portal, unchanged crystal/title and boot audio
        run: |
          set -euo pipefail
          APK=upstream/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" |
            grep -F "launchable-activity: name='com.charoitegames.core.CharoiteNextBootActivity'"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, io, wave, zipfile
          apk = Path("upstream/app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(apk) as z:
              icon = z.read("res/drawable-nodpi-v4/charoite_portal_icon.jpg")
              scene = z.read("res/drawable-nodpi-v4/charoite_next_boot_scene.jpg")
              master = Path("next-generation/assets/charoite_next_boot_reference.jpg").read_bytes()
              expected = "2f368b7731f8ff96db03842e0f36b62bc9d22c48fcdb77ed864846d6be44b748"
              assert hashlib.sha256(master).hexdigest() == expected
              assert icon == scene == master, "Boot artwork and launcher icon MUST be identical to user reference"
              from PIL import Image
              with Image.open(io.BytesIO(scene)) as picture:
                  picture.load()
                  assert picture.size == (1536, 1536)
                  assert picture.format == "JPEG"
              assert "res/drawable-nodpi-v4/charoite_next_boot_scene.png" not in z.namelist()
              # The icon keeps exact original bytes. Only the boot gets a
              # separate transparent-corner image and violet full bleed.
              foreground = z.read("res/drawable-nodpi-v4/charoite_next_boot_unframed.png")
              backdrop = z.read("res/drawable-nodpi-v4/charoite_next_boot_backdrop.jpg")
              portrait = z.read("res/drawable-nodpi-v4/charoite_next_boot_portrait.jpg")
              with Image.open(io.BytesIO(portrait)) as portrait_art:
                  assert portrait_art.size == (960, 1840), "Expected true 960x1840 portrait asset"
                  assert portrait_art.mode == "RGB"
                  for xy in ((0,0), (959,0), (0,1839), (959,1839)):
                      assert max(portrait_art.getpixel(xy)) > 20, "Original icon edge remained"
              print("CHAROITE_NEXT_SEAMLESS_PORTRAIT_BOOT=PASS")
              video_files = [n for n in z.namelist()
                             if n.endswith("/charoite_c_energy_reference_portal_7s.mp4")]
              assert len(video_files) == 1, "Expected exactly one packaged Mystic C movie"
              video_info = z.getinfo(video_files[0])
              assert video_info.compress_type == zipfile.ZIP_STORED, (
                  "Android openRawResourceFd requires uncompressed MP4")
              video = z.read(video_files[0])
              assert len(video) > 150000 and b"ftyp" in video[:24]
              assert b"avc1" in video, "Mystic C video must be AVC/H.264 for Android"
              assert b"mp4a" not in video, "The Mystic C animation must be SILENT"
              print("CHAROITE_NEXT_C_ENERGY_REFERENCE_PORTAL_MP4_PACKAGED=PASS")
              with Image.open(io.BytesIO(foreground)) as fg:
                  fg.load()
                  assert fg.mode == "RGBA" and fg.size == (1536, 1536)
                  for xy in ((0,0),(1535,0),(0,1535),(1535,1535)):
                      assert fg.getpixel(xy)[3] < 8, "Black outer icon corner still visible"
                  assert fg.getpixel((768,768))[3] > 250
              with Image.open(io.BytesIO(backdrop)) as bg:
                  bg.load()
                  assert bg.size == (900,1600)
                  for xy in ((0,0),(899,0),(0,1599),(899,1599)):
                      assert max(bg.getpixel(xy)) > 12, "Black background corner remained"
              print("CHAROITE_NEXT_FULLBLEED_BOOT_BLACK_FRAME_REMOVED=PASS")
              print("CHAROITE_NEXT_LAUNCHER_ICON_ORIGINAL_UNMODIFIED=PASS")
              print("CHAROITE_NEXT_USER_APPROVED_1536PX_ARTWORK_EXACT_MATCH=PASS")
              print("CHAROITE_NEXT_BOOT_AND_LAUNCHER_IDENTICAL_PIXELS=PASS")
              audio_files=[p for p in z.namelist()
                           if p.endswith("/charoite_crystal_startup.wav")]
              assert len(audio_files)==1, "Missing or duplicate original startup chime"
              with wave.open(io.BytesIO(z.read(audio_files[0])),"rb") as sound:
                  assert sound.getnchannels()==1
                  assert sound.getsampwidth()==2
                  assert sound.getframerate()==44100
                  assert sound.getnframes()==round(44100*7.0)
              print("CHAROITE_NEXT_SEVEN_SECOND_BOOT_SYNCED_CRYSTAL_SOUND=PASS")
          PY

      - name: Verify source-built Wine native loader is identical inside signed APK
        run: |
          python3 - <<'PY'
          import json,hashlib,struct,zipfile
          archive_path="upstream/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(archive_path) as apk:
              manifest=json.loads(apk.read("assets/charoite-next/wine-native-probe.json"))
              native=apk.read("lib/arm64-v8a/libcharoite_wine_loader.so")
              ntdll=apk.read("lib/arm64-v8a/libcharoite_wine_ntdll.so")
              server=apk.read("lib/arm64-v8a/libcharoite_wineserver.so")
              assert manifest["wineserver_native_library_filename"]=="libcharoite_wineserver.so"
              assert manifest["wineserver_version_arg"]=="--version"
              assert manifest["wineserver_device_tested"] is False
              assert len(server)==manifest["wineserver_size"]
              assert hashlib.sha256(server).hexdigest()==manifest["wineserver_sha256"]
              assert server[:6]==b"\x7fELF\x02\x01"
              assert struct.unpack_from("<H",server,16)[0]==3
              assert struct.unpack_from("<H",server,18)[0]==183
              print("CHAROITE_NEXT_WINESERVER_NATIVE_APK_VERIFIED=PASS")
              assert manifest["android_package"]=="com.charoitx"
              assert manifest["source_run"]==40898982875
              assert manifest["source_artifact"]==12908731604
              assert manifest["source_code_sha"]=="5d07e29fdba6552033d5f1a1a50ff1cc2fffe420"
              assert manifest["wine_source_sha"]=="c74acb09d51b447f5d5ac56c87608d3ec565a767"
              assert manifest["ntdll_native_library_filename"]=="libcharoite_wine_ntdll.so"
              assert len(ntdll)==manifest["ntdll_size"]
              assert hashlib.sha256(ntdll).hexdigest()==manifest["ntdll_sha256"]
              assert ntdll[:6]==b"\x7fELF\x02\x01"
              assert struct.unpack_from("<H",ntdll,16)[0]==3
              assert struct.unpack_from("<H",ntdll,18)[0]==183
              preflight=json.loads(apk.read("assets/charoite-next/wine-bootstrap-preflight.json"))
              assert preflight["schema_version"]==1
              assert preflight["android_package"]=="com.charoitx"
              assert preflight["wine_source_sha"]=="c74acb09d51b447f5d5ac56c87608d3ec565a767"
              assert preflight["source_run"]==40898982875
              assert preflight["component_count"]==22 and preflight["nls_count"]==76
              for flag in ("launch_ready","installable_as_runtime","prefix_created",
                           "fex_installed","graphics_verified","device_boot_tested",
                           "anti_cheat_supported"):
                  assert preflight[flag] is False
              assert len(preflight["bundle_manifest_sha256"])==64
              assert len(preflight["dependency_review_sha256"])==64
              assert isinstance(preflight["pe_imports_not_bundled"],list)
              assert isinstance(preflight["android_needed_libraries"],list)
              print("CHAROITE_NEXT_BOOTSTRAP_PREFLIGHT_ASSET_VERIFIED=PASS")
              payload=json.loads(apk.read("assets/charoite-next/wine-bootstrap-payload.json"))
              archive=apk.read("assets/charoite-next/wine-bootstrap-22.bundle")
              assert payload["schema_version"]==1
              assert payload["android_package"]=="com.charoitx"
              assert payload["wine_source_sha"]=="c74acb09d51b447f5d5ac56c87608d3ec565a767"
              assert payload["source_run"]==40898982875
              assert payload["source_artifact"]==12908731604
              assert payload["archive_asset"]=="charoite-next/wine-bootstrap-22.bundle"
              assert payload["component_count"]==22 and payload["pe_component_count"]==19
              assert payload["native_component_count"]==3 and payload["nls_count"]==76
              assert len(archive)==payload["archive_size"]
              assert hashlib.sha256(archive).hexdigest()==payload["archive_sha256"]
              assert payload["bundle_manifest_sha256"]==preflight["bundle_manifest_sha256"]
              assert payload["dependency_review_sha256"]==preflight["dependency_review_sha256"]
              assert payload["windows_imports_not_bundled_count"]==len(preflight["pe_imports_not_bundled"])
              for flag in ("launch_ready","installable_as_runtime","archive_extracted",
                           "prefix_created","fex_installed","graphics_verified",
                           "device_boot_tested","anti_cheat_supported"):
                  assert payload[flag] is False
              modules=json.loads(apk.read("assets/charoite-next/wine-module-staging-index.json"))
              assert modules["schema_version"]==1
              assert modules["android_package"]=="com.charoitx"
              assert modules["wine_source_sha"]=="c74acb09d51b447f5d5ac56c87608d3ec565a767"
              assert modules["source_run"]==40898982875
              assert modules["archive_sha256"]==payload["archive_sha256"]
              assert modules["file_count"]==95 and modules["pe_count"]==19 and modules["nls_count"]==76
              assert len(modules["files"])==95
              assert all(modules[flag] is False for flag in (
                  "launch_ready","native_elf_installed","prefix_created",
                  "wineboot_tested","anti_cheat_supported"))
              seen=set()
              total=0
              for item in modules["files"]:
                  name=item["asset"]
                  assert name.startswith("charoite-next/wine-modules/")
                  assert name not in seen
                  seen.add(name)
                  contents=apk.read("assets/"+name)
                  assert len(contents)==item["size"]
                  assert hashlib.sha256(contents).hexdigest()==item["sha256"]
                  assert item["source"]=="runtime/"+item["path"]
                  total+=len(contents)
              assert total==modules["total_bytes"] and total <= 128*1024*1024
              assert len([x for x in apk.namelist() if x.startswith("assets/charoite-next/wine-modules/")])==95
              print("CHAROITE_NEXT_95_ISOLATED_PE_NLS_ASSETS_VERIFIED=PASS")
              print("CHAROITE_NEXT_WINE_ARCHIVE_APK_SHA256_VERIFIED=PASS")
              assert b"CHAROITE_NTDLL_NATIVE_DIR" in native
              assert len(native)==manifest["size"]
              assert hashlib.sha256(native).hexdigest()==manifest["sha256"]
              assert native[:6]==b"\x7fELF\x02\x01"
              assert struct.unpack_from("<H",native,16)[0]==3
              assert struct.unpack_from("<H",native,18)[0]==183
              for name in ("launch_ready","installable_as_runtime","prefix_created","device_tested","anti_cheat_supported"):
                  assert manifest[name] is False
              print("CHAROITE_NEXT_WINE_NATIVE_APK_LOADER_VERIFIED=PASS")
              print("CHAROITE_NEXT_WINE_APK_NTDLL_VERIFIED=PASS")
              print("WINE_LOADER_SHA256="+manifest["sha256"])
              print("APK_WINE_VERSION_EXECUTION_NOT_TESTED_IN_CI")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            upstream/app/build/outputs/apk/debug/app-debug.apk | \
            grep -F "package: name='com.charoitx' versionCode='68' versionName='11.2-next.0.37'"

      - name: Verify APK signing matches persisted Charoite key
        run: |
          set -euo pipefail
          APK=upstream/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 |
            tr '[:upper:]' '[:lower:]')
          KEY=$(keytool -exportcert -keystore "$HOME/.android/charoite-next.keystore" \
            -alias androiddebugkey -storepass android |
            sha256sum | awk '{print $1}')
          echo "APK cert fingerprint: $ACTUAL"
          echo "Persisted key fingerprint: $KEY"
          test -n "$ACTUAL" && test "$ACTUAL" = "$KEY"
          echo "APK signing certificate matches cached signing key."

      - name: Verify Charoite Next adaptive icon and approved artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile
          apk = next(Path("upstream/app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as archive:
              files = set(archive.namelist())
              expected = {
                  "res/drawable-nodpi-v4/charoite_portal_icon.jpg",
                  "res/mipmap-anydpi-v26/ic_launcher.xml",
                  "res/mipmap-anydpi-v26/ic_launcher_round.xml",
              }
              missing = expected - files
              assert not missing, f"Required Android launcher icon resources missing: {missing}"
              image = archive.read("res/drawable-nodpi-v4/charoite_portal_icon.jpg")
              approved = Path("next-generation/assets/charoite_next_boot_reference.jpg").read_bytes()
              assert image == approved, "Launcher must display the exact user-supplied 1536px artwork"
              print("CHAROITE_NEXT_LAUNCHER_ASSET_EXACT_USER_REFERENCE=PASS")
              assert any(p.endswith("/charoite_portal_foreground.xml") for p in files)
              print("Valid approved artwork; modern adaptive and round icon assets packaged")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            upstream/app/build/outputs/apk/debug/app-debug.apk | \
            grep -F "application-label:'Charoite Next'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            upstream/app/build/outputs/apk/debug/app-debug.apk | \
            grep -F "package: name='com.charoitx'"

      - name: Verify APK JNI native cache paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = next(Path("upstream/app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              checked = 0
              for path in z.namelist():
                  if path.startswith("lib/") and path.endswith(".so"):
                      checked += 1
                      content = z.read(path)
                      for outdated in (b"/data/data/com.winlator", b"/data/data/com.touhoudr", b"/data/data/com.charoite/"):
                          if outdated in content:
                              raise AssertionError(f"Native library contains outdated application path: {path}")
              assert checked > 0, "No JNI binaries found in APK"
              print("Verified", checked, "native libraries have no stale Winlator app-data path")
          PY

      - name: Verify Japanese fonts and locale shipped in APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = next(Path("upstream/app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              assert "assets/japanese/japanese-support.tzst" in z.namelist()
              assert "assets/licenses/NotoSansCJK-OFL.txt" in z.namelist()
              assert "assets/licenses/IPA-Font-License-1.0.txt" in z.namelist()
              assert len(z.read("assets/japanese/japanese-support.tzst")) > 12000000
              print("Japanese locale and SIL OFL font license included")
          PY

      - name: Verify read-only installer probe is included
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = next(Path("upstream/app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              name = "assets/japanese/touhou_probe.exe"
              assert name in z.namelist(), "Missing Wine path probe"
              probe = z.read(name)
              assert probe.startswith(b"MZ"), "Probe is not a Windows executable"
              assert len(probe) > 10000
              print("Win32 Japanese diagnostic included:", len(probe), "bytes")
              for arch in ("32", "64"):
                  for name,signature in ((f"touhou_font_helper{arch}.exe",b"MZ"),(f"touhou_font_hook{arch}.dll",b"MZ")):
                      bundled = z.read("assets/japanese/" + name)
                      assert bundled.startswith(signature) and len(bundled) > 5000
                      print("Wine scoped font patch included:", name, len(bundled))
          PY

      - name: Verify Charoite Core general GDI diagnostic is packaged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = next(Path("upstream/app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              name = "assets/rendering/charoite_gdi_probe32.exe"
              content = z.read(name)
              assert content.startswith(b"MZ") and len(content) > 10000, "Missing Win32 GDI test"
              assert "charoite_gdi_render.log".encode("utf-16le") in content
              print("Bundled reusable Charoite Core read-only GDI test:", len(content), "bytes")
              owner = z.read("assets/rendering/charoite_ownerdraw_probe32.exe")
              assert owner.startswith(b"MZ") and len(owner) > 10000
              assert "charoite_ownerdraw_render.log".encode("utf-16le") in owner
              print("Bundled reusable read-only owner-draw comparison:", len(owner), "bytes")
          PY

      - name: Verify scan-code keyboard bridge is packaged
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("upstream/app/build/outputs/apk/debug/app-debug.apk") as z:
              exe=z.read("assets/input/charoite_keyscan.exe")
              assert exe[:2] == b"MZ" and len(exe) > 5000
              print("Windows scan-code helper packaged", len(exe))
          PY

      - name: Archive LGPL source and derivative patch
        run: |
          mkdir -p upstream/app/src/main/assets/licenses
          cp upstream/LICENSE upstream/app/src/main/assets/licenses/Winlator-LGPL-2.1.txt
          mkdir -p legal-bundle
          cp upstream/LICENSE legal-bundle/Winlator-LGPL-2.1.txt
          cp runtime-preview/NOTICE.md legal-bundle/NOTICE.md
          cp next-generation/engine-reference.json legal-bundle/engine-reference.json
          cp next-generation/prepare_next.py legal-bundle/prepare_next.py
          cp next-generation/rewrite_prefix_next.py legal-bundle/rewrite_prefix_next.py
          cp next-generation/CharoiteNextRuntime.java legal-bundle/CharoiteNextRuntime.java
          cp next-generation/CharoiteNextDiagnostics.java legal-bundle/CharoiteNextDiagnostics.java
          cp next-generation/CharoiteWineNativeProbe.java legal-bundle/CharoiteWineNativeProbe.java
          cp next-generation/CharoiteWineBootstrapPreflight.java legal-bundle/CharoiteWineBootstrapPreflight.java
          cp next-generation/CharoiteWineIsolatedStage.java legal-bundle/CharoiteWineIsolatedStage.java
          cp next-generation/stage_bootstrap_payload.py legal-bundle/stage_bootstrap_payload.py
          cp upstream/app/src/main/assets/charoite-next/wine-module-staging-index.json legal-bundle/wine-module-staging-index.json
          cp upstream/app/src/main/assets/charoite-next/wine-bootstrap-preflight.json legal-bundle/wine-bootstrap-preflight.json
          cp next-generation/stage_native_wine_loader.py legal-bundle/stage_native_wine_loader.py
