name: Wine29 Provider Postbuild
on:
  workflow_run:
    workflows: ['Wine29 Missing Provider ARM64 PE Cross-Build (No APK)']
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  verify:
    if: ${{ github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect completed build artifact without executing it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          echo "## Wine29 source-only postbuild verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream: https://github.com/$REPO/actions/runs/$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Conclusion: $CONCLUSION" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CONCLUSION" != success ]; then
            echo "Upstream not successful; inspect upstream job logs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python3 - "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))["artifacts"]
          hits=[x for x in a if x["name"]=="Wine29-HID-XInput-Five-ARM64-PE-NOT-APK" and not x["expired"]]
          assert len(hits)==1, "Expected exactly one unexpired five-module artifact"
          assert 0<hits[0]["size_in_bytes"]<20*1024*1024, "Artifact size cap exceeded"
          with open(sys.argv[1]+".id","w") as f: f.write(str(hits[0]["id"]))
          PY
          ARTIFACT_ID="$(cat "$RUNNER_TEMP/artifacts.json.id")"
          # gh api defaults to JSON-oriented output; use explicit octet-stream Accept for ZIP bytes.
          gh api -H "Accept: application/octet-stream" "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/evidence.zip"
          test -s "$RUNNER_TEMP/evidence.zip"
          test "$(wc -c < "$RUNNER_TEMP/evidence.zip")" -lt 20971520
          python3 - "$RUNNER_TEMP/evidence.zip" <<'PY'
          import hashlib,json,os,struct,sys,zipfile
          names=("mouhid","hidclass","hidparse","winehid","winexinput")
          with zipfile.ZipFile(sys.argv[1]) as z:
            entries=z.infolist()
            assert len(entries)<70 and sum(e.file_size for e in entries)<40*1024*1024
            assert all(not e.is_dir() and not e.filename.startswith("/") and ".." not in e.filename.split("/") for e in entries)
            assert all(e.file_size<32*1024*1024 for e in entries)
            members=set(z.namelist())
            with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("| Module | ARM64 PE and manifest integrity |\n| --- | --- |\n")
              for name in names:
                binary=name+"-arm64.sys"
                manifest=name+"-manifest.json"
                assert binary in members and manifest in members
                data=z.read(binary); m=json.loads(z.read(manifest))
                assert 1024<len(data)<32*1024*1024 and data[:2]==b"MZ"
                off=struct.unpack_from("<I",data,0x3c)[0]
                assert 64<=off<len(data)-24 and data[off:off+4]==b"PE\x00\x00"
                assert struct.unpack_from("<H",data,off+4)[0]==0xaa64
                assert hashlib.sha256(data).hexdigest()==m["sha256"]
                assert m["module"]==name+".sys"
                assert m["machine"]=="0xAA64" and m["source_commit"]=="c74acb09d51b447f5d5ac56c87608d3ec565a767"
                assert m["bytes"]==len(data) and m["pe_compilation_verified"] is True
                assert m["wine_executed"] is False and m["phone_tested"] is False
                assert m["native_companion_closure_verified"] is False
                assert m["runtime_compatibility_verified"] is False
                assert m["provider_import_closure_verified"] is False
                out.write(f"| {name}.sys | PASS |\n")
              assert "batch-import-closure.json" in members
              report=json.loads(z.read("batch-import-closure.json"))
              assert report["full_provider_closure_verified"] is False
              assert set(report["module_imports"])=={n+".sys" for n in names}
              assert report["native_companion_closure_verified"] is False
              assert report["runtime_compatibility_verified"] is False
              for name in names:
                manifest=json.loads(z.read(name+"-manifest.json"))
                imports=set(manifest["ordinary_imports"]+manifest["delay_imports"])
                details=report["module_imports"][name+".sys"]
                assert set(details["batch_resolved"]).isdisjoint(details["external_unverified"])
                assert set(details["batch_resolved"]+details["external_unverified"])==imports
              out.write("\nFull dependency closure and runtime compatibility NOT verified.\n")
          PY
