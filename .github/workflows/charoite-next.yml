name: Charoite Core Next Android
on:
  push:
    paths:
      - '.github/workflows/charoite-next.yml'
      - 'next-generation/**'
      - '!next-generation/charoite-wine/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: charoite-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      # Expose the real push run ID through GitHub commit status API.
      # This makes the workflow run discoverable from the connected GitHub tools.
      - name: Publish discoverable APK build run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=charoite-next-apk \
            -f description="Charoite Next APK build in progress" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "::warning::Unable to publish build run status; APK CI still proceeds."

      - name: Verify game folder import never auto-launches
        run: python3 -m unittest discover -s runtime-preview/tests -p 'test_*.py' -v

      - name: Install image processing tools for Next-only splash art
        run: python3 -m pip install --user --break-system-packages --disable-pip-version-check Pillow==11.3.0 numpy opencv-python-headless imageio-ffmpeg

      - name: Verify Next multi-engine isolation tests
        run: python3 -m unittest discover -s next-generation/tests -p 'test_*.py' -v

      - name: Get pinned LGPL Winlator upstream source
        run: |
          git clone --filter=blob:none --depth 1 https://github.com/brunodev85/winlator-app.git upstream
          cd upstream
          git fetch --depth 1 origin 8077f374ef2d54127b088de9e8cd7b4af14d9c8b
          git checkout --detach 8077f374ef2d54127b088de9e8cd7b4af14d9c8b
          test -f LICENSE
          test -f app/src/main/assets/rootfs.tzst

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install build dependencies
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'

      - name: Rebase embedded Box64 and Wine native paths
        run: |
          command -v zstd
          python3 next-generation/rewrite_prefix_next.py upstream

      - name: Verify Box64 points to this app's private loader
        run: |
          mkdir -p /tmp/touhou-elf-check
          tar --use-compress-program=zstd -xf upstream/app/src/main/assets/box64/box64-0.4.4.tzst -C /tmp/touhou-elf-check ./usr/local/bin/box64
          python3 - <<'PY'
          from pathlib import Path
          box64 = Path('/tmp/touhou-elf-check/usr/local/bin/box64').read_bytes()
          assert b'/data/data/com.charoitx/files/rootfs/lib/ld-linux-aarch64.so.1' in box64
          assert b'/data/data/com.winlator/' not in box64
          assert b'/data/data/com.touhoudr/' not in box64
          assert b'/data/data/com.charoitx/' in box64
          assert b'/data/data/com.charoite/' not in box64
          print('Box64 loader uses the separate Charoite Next private application data path.')
          PY

      - name: Build licensed Japanese language support pack
        run: |
          command -v localedef
          command -v fc-scan
          python3 runtime-preview/charoite-core/japanese/build_japanese_support.py upstream

      - name: Restore compiled Japanese installer helpers
        id: japanese-helper-cache
        uses: actions/cache@v4
        with:
          path: |
            runtime-preview/charoite-core/japanese/touhou_probe.exe
            runtime-preview/charoite-core/japanese/touhou_font_hook32.dll
            runtime-preview/charoite-core/japanese/touhou_font_hook64.dll
            runtime-preview/charoite-core/japanese/touhou_font_helper32.exe
            runtime-preview/charoite-core/japanese/touhou_font_helper64.exe
            runtime-preview/charoite-core/rendering/charoite_gdi_probe32.exe
            runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe32.exe
            runtime-preview/charoite-core/input/charoite_keyscan.exe
            runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.exe
          key: charoite-win32-tools-v5-${{ hashFiles('runtime-preview/charoite-core/japanese/touhou_probe.c', 'runtime-preview/charoite-core/japanese/touhou_font_hook.c', 'runtime-preview/charoite-core/japanese/touhou_font_helper.c', 'runtime-preview/charoite-core/rendering/charoite_gdi_probe.c', 'runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe.c', 'runtime-preview/charoite-core/input/charoite_keyscan.c', 'runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.c') }}

      - name: Compile Japanese installer font helpers
        if: steps.japanese-helper-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          # Ubuntu's Azure apt mirror stalled on 120 MB of MinGW packages
          # (exit code 124). Download a pinned, verified LLVM-MinGW toolchain.
          TOOLCHAIN=/tmp/charoite-llvm-mingw
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-msvcrt-ubuntu-22.04-x86_64.tar.xz"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 25 --max-time 240 \
            "$URL" -o /tmp/charoite-llvm-mingw.tar.xz
          echo "ceb8c5acc6f76e143f9c714772d2fa677027802561ce68c396e8dc990a80f0b6  /tmp/charoite-llvm-mingw.tar.xz" | sha256sum --check
          mkdir -p "$TOOLCHAIN"
          tar -xJf /tmp/charoite-llvm-mingw.tar.xz -C "$TOOLCHAIN" --strip-components=1
          CC32="$TOOLCHAIN/bin/i686-w64-mingw32-clang"
          CC64="$TOOLCHAIN/bin/x86_64-w64-mingw32-clang"
          test -x "$CC32" && test -x "$CC64"
          "$CC64" -std=c11 -O2 -Wall -Wextra -municode -mwindows \
            runtime-preview/charoite-core/japanese/touhou_probe.c -o runtime-preview/charoite-core/japanese/touhou_probe.exe \
            -luser32 -lgdi32
          for arch in 32 64; do
            if [ "$arch" = 32 ]; then cc="$CC32"; else cc="$CC64"; fi
            "$cc" -std=c11 -O2 -Wall -Wextra -shared \
              runtime-preview/charoite-core/japanese/touhou_font_hook.c \
              -o "runtime-preview/charoite-core/japanese/touhou_font_hook${arch}.dll" \
              -luser32 -lgdi32
            "$cc" -std=c11 -O2 -Wall -Wextra -municode -mwindows \
              runtime-preview/charoite-core/japanese/touhou_font_helper.c \
              -o "runtime-preview/charoite-core/japanese/touhou_font_helper${arch}.exe" \
              -luser32
            file "runtime-preview/charoite-core/japanese/touhou_font_hook${arch}.dll" "runtime-preview/charoite-core/japanese/touhou_font_helper${arch}.exe"
            # Fail CI if callback decoration drifts from the helper lookup.
            if [ "$arch" = 32 ]; then symbol="TouhouDrawHook@12"; else symbol="TouhouDrawHook"; fi
            objdump -p "runtime-preview/charoite-core/japanese/touhou_font_hook${arch}.dll" |
              grep -F " $symbol"
            # Verify the new native, pre-draw, read-only audit is exported
            # with the correct LLVM-MinGW x86/x64 decoration.
            if [ "$arch" = 32 ]; then audit="TouhouAuditHook@12"; else audit="TouhouAuditHook"; fi
            objdump -p "runtime-preview/charoite-core/japanese/touhou_font_hook${arch}.dll" |
              grep -F " $audit"
            test $(stat -c %s "runtime-preview/charoite-core/japanese/touhou_font_hook${arch}.dll") -gt 5000
            test $(stat -c %s "runtime-preview/charoite-core/japanese/touhou_font_helper${arch}.exe") -gt 5000
          done
          file runtime-preview/charoite-core/japanese/touhou_probe.exe
          test $(stat -c %s runtime-preview/charoite-core/japanese/touhou_probe.exe) -gt 10000
          # Shared read-only Unicode/CP932 test tool, deliberately not a Wine patch.
          "$CC32" -std=c11 -O2 -Wall -Wextra -municode -mwindows \
            runtime-preview/charoite-core/rendering/charoite_gdi_probe.c \
            -o runtime-preview/charoite-core/rendering/charoite_gdi_probe32.exe \
            -luser32 -lgdi32
          file runtime-preview/charoite-core/rendering/charoite_gdi_probe32.exe
          test $(stat -c %s runtime-preview/charoite-core/rendering/charoite_gdi_probe32.exe) -gt 10000
          "$CC32" -std=c11 -O2 -Wall -Wextra -municode -mwindows \
            runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe.c \
            -o runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe32.exe \
            -luser32 -lgdi32
          file runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe32.exe
          test $(stat -c %s runtime-preview/charoite-core/rendering/charoite_ownerdraw_probe32.exe) -gt 10000
          # Keyboard scan-code helper is a small Windows executable.
          "$CC32" -std=c11 -O2 -Wall -Wextra -mwindows \
            runtime-preview/charoite-core/input/charoite_keyscan.c \
            -o runtime-preview/charoite-core/input/charoite_keyscan.exe \
            -lws2_32 -luser32
          test $(stat -c %s runtime-preview/charoite-core/input/charoite_keyscan.exe) -gt 5000
          # Standalone Win32-only, read-only Battle.net DNS/HTTPS/Agent probe.
          "$CC32" -std=c11 -O2 -Wall -Wextra -mwindows \
            runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.c \
            -o runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.exe \
            -lwinhttp -lws2_32 -luser32 -ladvapi32 -liphlpapi
          file runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.exe
          test $(stat -c %s runtime-preview/charoite-core/diagnostics/charoite_bnet_network_probe.exe) -gt 5000

      - name: Apply stable Charoite Core feature overlay
        run: python3 runtime-preview/overlay.py upstream

      - name: Install separate Charoite Next app identity and engine inventory
        run: python3 next-generation/prepare_next.py upstream

      - name: Stage exact verified Wine PE binaries for read-only device diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charoite-wine-phone-probe/foundation" "$RUNNER_TEMP/charoite-wine-phone-probe/expansion"
          gh run download 40791083178 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine-ARM64EC-PE-Foundation-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine-phone-probe/foundation"
          gh run download 40791083178 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine-ARM64EC-PE-Expansion-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine-phone-probe/expansion"
          python3 next-generation/stage_wine_probe.py \
            "$RUNNER_TEMP/charoite-wine-phone-probe/foundation" \
            "$RUNNER_TEMP/charoite-wine-phone-probe/expansion" \
            upstream

      - name: Stage exact source-built Wine Android ELF for user-initiated --version smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charoite-wine-native-probe"
          gh run download 40898982875 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine-Coherent-Bootstrap-22-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine-native-probe"
          python3 next-generation/stage_native_wine_loader.py \
            "$RUNNER_TEMP/charoite-wine-native-probe/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/jniLibs/arm64-v8a/libcharoite_wine_loader.so
          test -s upstream/app/src/main/jniLibs/arm64-v8a/libcharoite_wine_ntdll.so
          test -s upstream/app/src/main/jniLibs/arm64-v8a/libcharoite_wineserver.so
          echo "Wine ELF staged ONLY for native Android --version, not as a gaming runtime."

      - name: Bundle all 22 audited Wine components and 76 NLS tables as inert Next APK assets
        run: |
          set -euo pipefail
          python3 next-generation/stage_bootstrap_payload.py \
            "$RUNNER_TEMP/charoite-wine-native-probe/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-22.bundle
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-payload.json
          echo "Wine bootstrap archive is an immutable APK asset, NOT an installed runtime."

      - name: Stage separately verified Wine26 PE/NLS data archive without mixing Wine22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charoite-wine26"
          gh run download 41121328663 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine-Coherent-Bootstrap-26-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine26"
          python3 next-generation/stage_wine26.py \
            "$RUNNER_TEMP/charoite-wine26/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-26.bundle
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-26-index.json
          echo "Wine26 23 PE + 76 NLS modules are distinct inert assets; old native Wine unchanged."

      - name: Package matching Wine26 native ELF for user-approved version-only tests
        run: |
          set -euo pipefail
          python3 next-generation/stage_wine26_native.py \
            "$RUNNER_TEMP/charoite-wine26/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine26-native-probe.json
          for name in loader ntdll wineserver; do
            test -s "upstream/app/src/main/jniLibs/arm64-v8a/libcharoite_wine26_${name}.so"
          done
          echo "Only APK-installed source-matched Wine26 native binaries may run --version."

      - name: Stage patched Wine27 PE/NLS cohort in a distinct versioned APK slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charoite-wine27"
          gh run download 41130899651 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine-Coherent-Bootstrap-26-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine27"
          python3 next-generation/stage_wine27.py \
            "$RUNNER_TEMP/charoite-wine27/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-27.bundle
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-27-index.json
          echo "Wine27 APK assets preserve earlier Wine22/Wine26 cohorts."

      - name: Package patched Wine27 native cohort without replacing older ELF libraries
        run: |
          set -euo pipefail
          python3 next-generation/stage_wine27_native.py \
            "$RUNNER_TEMP/charoite-wine27/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine27-native-probe.json
          for name in loader ntdll wineserver; do
            test -s "upstream/app/src/main/jniLibs/arm64-v8a/libcharoite_wine27_${name}.so"
          done
          echo "Native patched loader, ntdll and server are APK-only and v3-consent gated."

      - name: Stage independent patched Wine28 0.7 PE/NLS data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charoite-wine28"
          gh run download 41144679591 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine-Coherent-Bootstrap-26-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine28"
          python3 next-generation/stage_wine28.py \
            "$RUNNER_TEMP/charoite-wine28/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-28.bundle
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-28-index.json
          echo "Separate Wine28 0.7 PE/NLS staged; Wine22/26/27 unchanged."

      - name: Package source-matched Wine28 native ELF in distinct APK filenames
        run: |
          set -euo pipefail
          python3 next-generation/stage_wine28_native.py \
            "$RUNNER_TEMP/charoite-wine28/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine28-native-probe.json
          for name in loader ntdll wineserver; do
            test -s "upstream/app/src/main/jniLibs/arm64-v8a/libcharoite_wine28_${name}.so"
          done
          echo "Distinct Wine28 native source cohort verified; no execution in CI."

      - name: Stage verified Wine29 API-set PE/NLS as INERT Next assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charoite-wine29"
          gh run download 41586391767 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine-Coherent-Bootstrap-27-APISet-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine29"
          python3 next-generation/stage_wine29.py \
            "$RUNNER_TEMP/charoite-wine29/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-29.bundle
          test -s upstream/app/src/main/assets/charoite-next/wine-bootstrap-29-index.json
          echo "Inert 27-component Wine29 API-set data staged; old Wine28 untouched."
      - name: Package independently verified Wine29 .0.7 full source + distinct native cohort INERT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charoite-wine29-source07"
          gh run download 41749167248 --repo "$GITHUB_REPOSITORY" \
            --name Charoite-Wine29-Coherent-27-APISet-NLS-Experimental \
            --dir "$RUNNER_TEMP/charoite-wine29-source07"
          echo "66068032bd2203c8e53fddc92ce46b84086eb293306b2bd12bb741bf9a5e035e  $RUNNER_TEMP/charoite-wine29-source07/charoite-wine-bootstrap-bundle.tar.gz" | sha256sum --check
          python3 next-generation/stage_wine29_native07.py \
            "$RUNNER_TEMP/charoite-wine29-source07/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          python3 next-generation/stage_wine29_07_modules.py \
            "$RUNNER_TEMP/charoite-wine29-source07/charoite-wine-bootstrap-bundle.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine29-native07/modules/pe_arm64ec_apisetschema.dll.bin
          test -s upstream/app/src/main/assets/charoite-next/wine29-native07/modules/pe_arm64_wineboot.exe.bin
          test -s upstream/app/src/main/assets/charoite-next/wine29-native07/modules/nls_l_intl.nls.bin
          test -s upstream/app/src/main/assets/charoite-next/wine29-native07/wine29-native07-index.json
          test -s upstream/app/src/main/assets/charoite-next/wine29-native07/wine29-source-matched.bundle
          for name in loader wineserver ntdll; do
            test -s "upstream/app/src/main/jniLibs/arm64-v8a/libcharoite_wine29_${name}.so"
          done
          echo "Wine29 0.7 fully pinned; old Wine29 0.6 and Wine28 source paths unchanged; no execution."

      - name: Audit source-matched Wine29 ELF selector literals without execution
        run: |
          set -euo pipefail
          python3 next-generation/audit_wine29_07_selectors.py \
            upstream/app/src/main/assets/charoite-next/wine29-native07/wine29-native07-index.json \
            upstream/app/src/main/jniLibs/arm64-v8a \
            --output "$RUNNER_TEMP/wine29-native-selector-audit.json"
          test -s "$RUNNER_TEMP/wine29-native-selector-audit.json"
          echo "Only signed-index native ELF hashes and literal strings inspected; no loader, PE or phone execution."

      - name: Publish bounded Wine29 native selector evidence
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine29-Native-Selector-Audit-Read-Only
          path: ${{ runner.temp }}/wine29-native-selector-audit.json
          if-no-files-found: error
          retention-days: 30


      - name: Audit exact Wine29 native source selector call sites (no execution)
        run: |
          set -euo pipefail
          python3 next-generation/audit_wine29_07_native_callsites.py \
            "$RUNNER_TEMP/charoite-wine29-source07/charoite-wine-bootstrap-bundle.tar.gz" \
            --output "$RUNNER_TEMP/wine29-native-callsite-audit.json"
          test -s "$RUNNER_TEMP/wine29-native-callsite-audit.json"

      - name: Publish Wine29 native source call-site evidence
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Wine29-Native-Callsite-Audit-Read-Only
          path: ${{ runner.temp }}/wine29-native-callsite-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Stage independent Wine29 0.12 111-file sealed DATA-only assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charoite-wine29-sealed012"
          gh run download 41947164001 --repo "$GITHUB_REPOSITORY" \
            --name Wine29-07-34-DLL-76-NLS-Sealed-Data-Only-NOT-APK \
            --dir "$RUNNER_TEMP/charoite-wine29-sealed012"
          echo "ada8bd980722deba16e89231652a25a27a7e197a7638abc9d38a61e0614e412e  $RUNNER_TEMP/charoite-wine29-sealed012/wine29-07-34-dll-76-nls-data-only.tar.gz" | sha256sum --check
          python3 next-generation/stage_wine29_sealed012.py \
            "$RUNNER_TEMP/charoite-wine29-sealed012/wine29-07-34-dll-76-nls-data-only.tar.gz" \
            upstream
          test -s upstream/app/src/main/assets/charoite-next/wine29-sealed012/wine29-sealed012-index.json
          test -s upstream/app/src/main/assets/charoite-next/wine29-sealed012/modules/pe_arm64ec_mpr.dll.bin
          test -s upstream/app/src/main/assets/charoite-next/wine29-sealed012/modules/pe_arm64_wineboot.exe.bin
          test -s upstream/app/src/main/assets/charoite-next/wine29-sealed012/modules/nls_l_intl.nls.bin
          echo WINE29_012_111_APK_DATA_ASSETS_NO_EXECUTION=PASS


      - name: Pin and stage source-matched Wine29 v6 native ELF cohort (no execution)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="repos/$GITHUB_REPOSITORY/actions/artifacts/13580905064"
          test "$(gh api "$API" --jq '.workflow_run.head_sha')" = "c069cd0f857823c8177d1237ee42d43d691f72c6"
          test "$(gh api "$API" --jq '.digest')" = "sha256:2111491b9040c85c8c08c3a55f81f682f95057bb9b6e5a9ad848c2d8b6299d19"
          test "$(gh api "$API" --jq '.expired')" = "false"
          mkdir "$RUNNER_TEMP/charoite-wine29-v6-source"
          gh run download 42387905132 --repo "$GITHUB_REPOSITORY" \
            --name Wine29-V6-Native-Child-Loader-Candidate-NOT-APK \
