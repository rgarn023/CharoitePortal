name: Wine29 Missing Provider ARM64 PE Cross-Build (No APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wine29-first-provider-crossbuild.yml'
      - 'next-generation/charoite-wine/prepare-source.sh'
      - 'next-generation/charoite-wine/build-arm64ec-ntdll.sh'
      - 'next-generation/wine29-imports/classify.py'

permissions:
  contents: read

# Serialize manual cross-builds to avoid overlapping expensive standard-runner jobs.
# A pending duplicate is not a reason to cancel an active evidence-producing build.
concurrency:
  # New generation isolates dispatches from a stale, uncancellable old queue.
  group: wine29-first-provider-crossbuild-v2
  cancel-in-progress: false

# Automatically rebuild only when provider build inputs change on main; manual dispatch remains available.
# No Wine process, Android app, device, prefix, historical scratch, or APK.
jobs:
  mouhid-arm64-pe:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check shell block syntax before expensive toolchain setup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, tempfile
          workflow = pathlib.Path(".github/workflows/wine29-first-provider-crossbuild.yml")
          lines = workflow.read_text().splitlines()
          blocks = []
          current = None
          for line in lines:
              if line == "        run: |":
                  current = []
                  blocks.append(current)
              elif current is not None:
                  if line.startswith("          "):
                      current.append(line[10:])
                  elif line.strip() == "":
                      current.append("")
                  else:
                      current = None
          assert len(blocks) >= 5, "Unexpected workflow run-block count"
          for index, block in enumerate(blocks, 1):
              with tempfile.NamedTemporaryFile(mode="w", suffix=".sh") as script:
                  script.write("\n".join(block) + "\n")
                  script.flush()
                  subprocess.run(["bash", "-n", script.name], check=True)
              print(f"SHELL_BLOCK_{index}_SYNTAX=PASS")
          PY
      - name: Verify pinned source and isolated output contracts
        run: |
          set -euo pipefail
          grep -Fq 'c74acb09d51b447f5d5ac56c87608d3ec565a767' next-generation/charoite-wine/prepare-source.sh
          test ! -e "$GITHUB_WORKSPACE/wine29-first-provider-candidate"
          test -f next-generation/charoite-wine/build-arm64ec-ntdll.sh
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.3.13750724'
          test -x "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
      - name: Fetch checksum-pinned LLVM-MinGW cross-compiler
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/llvm-mingw-20261020.tar.xz"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 25 --max-time 300 \
            'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz' -o "$ARCHIVE"
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  $ARCHIVE" | sha256sum --check
          mkdir "$RUNNER_TEMP/charoite-llvm-mingw"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/charoite-llvm-mingw" --strip-components=1
          test -x "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj"
      - name: Prepare exact pinned Wine source in fresh CI scratch
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/charoite-first-provider-source"
          bash next-generation/charoite-wine/prepare-source.sh "$ROOT"
          test -f "$ROOT/dlls/mouhid.sys/Makefile.in"
          test -f "$ROOT/dlls/hidclass.sys/Makefile.in"
          test -f "$ROOT/dlls/hidparse.sys/Makefile.in"
          test -f "$ROOT/dlls/winehid.sys/Makefile.in"
          test -f "$ROOT/dlls/winexinput.sys/Makefile.in"
          grep -Eq '^MODULE[[:space:]]*=[[:space:]]*hidparse.sys$' "$ROOT/dlls/hidparse.sys/Makefile.in"
          grep -Eq '^MODULE[[:space:]]*=[[:space:]]*mouhid.sys$' "$ROOT/dlls/mouhid.sys/Makefile.in"
          grep -Eq '^IMPORTS[[:space:]]*=[[:space:]]*ntoskrnl hidparse win32u$' "$ROOT/dlls/mouhid.sys/Makefile.in"
          git -C "$ROOT" diff --check
      - name: Inventory remaining Wine29 provider source requirements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"charoite-first-provider-source"
          targets=("mscms.dll","winebth.sys","winebus.sys","wineusb.sys")
          inventory={}
          for name in targets:
              makefile=root/"dlls"/name/"Makefile.in"
              assert makefile.is_file() and not makefile.is_symlink(), f"Missing pinned source: {name}"
              source=makefile.read_text().splitlines()
              def fields(key):
                  values=[]
                  for line in source:
                      if line.startswith(key+" ") or line.startswith(key+"="):
                          values.extend(line.partition("=")[2].split())
                  return sorted(set(values))
              inventory[name]={"makefile":str(makefile.relative_to(root)),
                               "imports_declared":fields("IMPORTS"),
                               "unix_libs_declared":fields("UNIX_LIBS"),
                               "sources_declared":fields("SOURCES"),
                               "native_companion_verified":False,
                               "pe_build_verified":False,
                               "runtime_verified":False}
          out=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"wine29-provider-source-inventory.json"
          out.write_text(json.dumps({"source_commit":"c74acb09d51b447f5d5ac56c87608d3ec565a767",
                                    "scope":"pinned source Makefile declarations only",
                                    "providers":inventory},indent=2,sort_keys=True)+chr(10))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write("## Remaining provider source inventory (not built)"+chr(10)+chr(10))
              summary.write("| Provider | Declared imports | Unix libraries |"+chr(10)+"| --- | --- | --- |"+chr(10))
              for name,info in inventory.items():
                  summary.write(f"| {name} | {', '.join(info['imports_declared']) or 'None declared'} | {', '.join(info['unix_libs_declared']) or 'None declared'} |"+chr(10))
              summary.write(chr(10)+"Source inventory only; native companion closure and runtime NOT VERIFIED."+chr(10))
          print("REMAINING_PROVIDER_SOURCE_INVENTORY=PASS")
          PY
      - name: Build pinned Wine ARM64 host and Android native toolchain (no execution)
        run: |
          set -euo pipefail
          bash next-generation/charoite-wine/build-arm64ec-ntdll.sh \
            "$RUNNER_TEMP/charoite-first-provider-source" \
            "$ANDROID_HOME/ndk/27.3.13750724" \
            "$RUNNER_TEMP/charoite-llvm-mingw"
      - name: Cross-compile five pinned ARM64 HID/XInput PE modules; inspect imports
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/charoite-first-provider-source"
          BUILD="$ROOT/charoite-arm64ec-android"
          cd "$BUILD"
          # Five pinned-source Windows ARM64 PE modules, including HID parser dependency; no Wine execution.
          make -j2 dlls/mouhid.sys/aarch64-windows/mouhid.sys dlls/hidclass.sys/aarch64-windows/hidclass.sys dlls/hidparse.sys/aarch64-windows/hidparse.sys dlls/winehid.sys/aarch64-windows/winehid.sys dlls/winexinput.sys/aarch64-windows/winexinput.sys
          OUT="$GITHUB_WORKSPACE/wine29-first-provider-candidate"
          mkdir "$OUT"
          for module in mouhid hidclass hidparse winehid winexinput; do
            BIN="$BUILD/dlls/$module.sys/aarch64-windows/$module.sys"
            test -s "$BIN"
            test ! -L "$BIN"
            cp "$BIN" "$OUT/$module-arm64.sys"
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" --file-headers "$BIN" > "$OUT/$module-pe-header.txt"
            "$RUNNER_TEMP/charoite-llvm-mingw/bin/llvm-readobj" --coff-imports "$BIN" > "$OUT/$module-pe-imports.txt"
          done
          python3 - "$OUT" <<'PY'
          import hashlib, importlib.util, json, pathlib, struct, sys
          out=pathlib.Path(sys.argv[1])
          path=pathlib.Path(__import__("os").environ["GITHUB_WORKSPACE"])/"next-generation/wine29-imports/classify.py"
          spec=importlib.util.spec_from_file_location("charoite_imports",path)
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          for name in ("mouhid", "hidclass", "hidparse", "winehid", "winexinput"):
            binary=out/(name+"-arm64.sys")
            raw=binary.read_bytes()
            assert 1000 < len(raw) < 32*1024*1024
            assert raw[:2] == b"MZ"
            offset=struct.unpack_from("<I",raw,0x3c)[0]
            assert 64 <= offset < len(raw)-24 and raw[offset:offset+4] == b"PE\0\0"
            machine=struct.unpack_from("<H",raw,offset+4)[0]
            assert machine == 0xAA64, f"{name}: expected ARM64 PE 0xAA64, got {machine:04x}"
            ordinary, delayed=module.pe_imports(raw)
            assert ordinary, f"{name}: provider PE has no ordinary imports; investigate"
            report={
              "schema_version":1, "module":name+".sys",
              "source_commit":"c74acb09d51b447f5d5ac56c87608d3ec565a767",
              "package":"com.charoitx", "machine":"0xAA64",
              "sha256":hashlib.sha256(raw).hexdigest(), "bytes":len(raw),
              "ordinary_imports":ordinary, "delay_imports":delayed,
              "pe_compilation_verified":True,
              "provider_import_closure_verified":False,
              "native_companion_closure_verified":False,
              "runtime_compatibility_verified":False,
              "wine_executed":False, "phone_tested":False,
              "historical_scratch_accessed":False
            }
            (out/(name+"-manifest.json")).write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
            print(f"{name.upper()}_ARM64_PE_BUILD_AND_IMPORT_INSPECTION=PASS")
          # Distinguish imports resolved within this candidate batch from imports
          # requiring independently verified PE/native providers.
          batch={name+".sys" for name in ("mouhid", "hidclass", "hidparse", "winehid", "winexinput")}
          closure={}
          for name in ("mouhid", "hidclass", "hidparse", "winehid", "winexinput"):
            manifest=json.loads((out/(name+"-manifest.json")).read_text())
            imports=sorted(set(manifest["ordinary_imports"]+manifest["delay_imports"]))
            local=sorted(x for x in imports if x.lower() in batch)
            external=sorted(x for x in imports if x.lower() not in batch)
            closure[name+".sys"]={"batch_resolved":local,"external_unverified":external}
            print(f"{name.upper()}_BATCH_RESOLVED={','.join(local) or 'none'}")
            print(f"{name.upper()}_EXTERNAL_UNVERIFIED={','.join(external) or 'none'}")
          (out/"batch-import-closure.json").write_text(
              json.dumps({"schema_version":1,"scope":"five-module candidate batch only",
                          "module_imports":closure,"full_provider_closure_verified":False,
                          "native_companion_closure_verified":False,
                          "runtime_compatibility_verified":False},
                         indent=2,sort_keys=True)+"\n")
          print("IMPORT_CLOSURE_AND_RUNTIME=UNVERIFIED")
          summary=pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as stream:
            stream.write("## Wine29 source-only candidate coverage\n\n")
            stream.write("| Module | Candidate-batch imports | External imports (unverified) |\n")
            stream.write("| --- | --- | --- |\n")
            for name, details in sorted(closure.items()):
              local=", ".join(details["batch_resolved"]) or "None"
              external=", ".join(details["external_unverified"]) or "None"
              stream.write(f"| {name} | {local} | {external} |\n")
            stream.write("\n**Full dependency closure, native companions and Android runtime: NOT VERIFIED.**\n")
          print("GITHUB_STEP_SUMMARY=WRITTEN")
          PY
      - name: Probe remaining four provider PE build targets without blocking proven batch
        continue-on-error: true
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/charoite-first-provider-source"
          BUILD="$ROOT/charoite-arm64ec-android"
          OUT="$GITHUB_WORKSPACE/wine29-provider-build-probes"
          mkdir "$OUT"
          cd "$BUILD"
          for module in mscms.dll winebth.sys winebus.sys wineusb.sys; do
            echo "Probing source-built PE target: $module"
            LOG="$OUT/$module-build.log"
            if timeout 180 make -j2 "dlls/$module/aarch64-windows/$module" > "$LOG" 2>&1; then
              BIN="$BUILD/dlls/$module/aarch64-windows/$module"
              if test -s "$BIN" && test ! -L "$BIN"; then
                cp "$BIN" "$OUT/$module-arm64-pe-candidate"
                echo "$module PE build candidate produced; imports/native companion/runtime NOT verified" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "$module target returned success without expected PE file" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "$module build probe failed or timed out; see bounded log artifact" >> "$GITHUB_STEP_SUMMARY"
            fi
            tail -c 65536 "$LOG" > "$LOG.bounded" || :
            mv "$LOG.bounded" "$LOG"
          done
      - name: Publish remaining-provider build probe logs (NOT APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wine29-Remaining-Provider-Build-Probes-NOT-APK
          path: wine29-provider-build-probes/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify five-module evidence set before publishing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct
          root=pathlib.Path("wine29-first-provider-candidate")
          names=("mouhid","hidclass","hidparse","winehid","winexinput")
          assert root.is_dir() and not root.is_symlink()
          for name in names:
              binary=root/(name+"-arm64.sys")
              manifest=root/(name+"-manifest.json")
              assert binary.is_file() and not binary.is_symlink()
              assert manifest.is_file() and not manifest.is_symlink()
              raw=binary.read_bytes()
              info=json.loads(manifest.read_text())
              assert 1024<len(raw)<32*1024*1024
              offset=struct.unpack_from("<I",raw,0x3c)[0]
              assert raw[:2]==b"MZ" and 64<=offset<len(raw)-24
              assert raw[offset:offset+4]==b"PE\x00\x00"
              assert struct.unpack_from("<H",raw,offset+4)[0]==0xaa64
              assert hashlib.sha256(raw).hexdigest()==info["sha256"]
              assert info["module"]==name+".sys"
              assert info["provider_import_closure_verified"] is False
              assert info["runtime_compatibility_verified"] is False
              print(f"{name.upper()}_EVIDENCE_INTEGRITY=PASS")
          closure=json.loads((root/"batch-import-closure.json").read_text())
          assert closure["full_provider_closure_verified"] is False
          assert set(closure["module_imports"])=={name+".sys" for name in names}
          print("FIVE_MODULE_EVIDENCE_SET=PASS; FULL_CLOSURE=UNVERIFIED")
          PY
      - name: Publish bounded source-built PE evidence (NOT APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wine29-HID-XInput-Five-ARM64-PE-NOT-APK
          path: wine29-first-provider-candidate/
          if-no-files-found: error
          retention-days: 7
