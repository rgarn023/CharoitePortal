              assert "charoite_ownerdraw_render.log".encode("utf-16le") in owner
              print("Bundled reusable read-only owner-draw comparison:", len(owner), "bytes")
          PY

      - name: Verify scan-code keyboard bridge is packaged
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("upstream/app/build/outputs/apk/debug/app-debug.apk") as z:
              exe=z.read("assets/input/charoite_keyscan.exe")
              assert exe[:2] == b"MZ" and len(exe) > 5000
              print("Windows scan-code helper packaged", len(exe))
          PY

