name: Touhou Wine Runtime Preview
on:
  push:
    paths:
      - '.github/workflows/runtime-preview.yml'
      - 'runtime-preview/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touhou-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Get pinned LGPL Winlator upstream source
        run: |
          git clone --filter=blob:none --depth 1 https://github.com/brunodev85/winlator-app.git upstream
          cd upstream
          git fetch --depth 1 origin 8077f374ef2d54127b088de9e8cd7b4af14d9c8b
          git checkout --detach 8077f374ef2d54127b088de9e8cd7b4af14d9c8b
          test -f LICENSE
          test -f app/src/main/assets/rootfs.tzst

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install build dependencies
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'

      - name: Rebase embedded Box64 and Wine native paths
        run: |
          command -v zstd
          python3 runtime-preview/rewrite_prefix.py upstream

      - name: Verify Box64 points to this app's private loader
        run: |
          mkdir -p /tmp/touhou-elf-check
          tar --use-compress-program=zstd -xf upstream/app/src/main/assets/box64/box64-0.4.4.tzst -C /tmp/touhou-elf-check ./usr/local/bin/box64
          python3 - <<'PY'
          from pathlib import Path
          box64 = Path('/tmp/touhou-elf-check/usr/local/bin/box64').read_bytes()
          assert b'/data/data/com.touhoudr/files/rootfs/lib/ld-linux-aarch64.so.1' in box64
          assert b'/data/data/com.winlator/' not in box64
          print('Box64 loader uses Touhou package path, not inaccessible Winlator data.')
          PY

      - name: Build licensed Japanese language support pack
        run: |
          command -v localedef
          command -v fc-scan
          python3 runtime-preview/build_japanese_support.py upstream

      - name: Compile Japanese installer font helpers
        timeout-minutes: 12
        run: |
          # Ubuntu runners may already have cross-compilers. Avoid indefinite
          # apt lock/mirror waits by checking first and bounding installs.
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null ||
             ! command -v i686-w64-mingw32-gcc >/dev/null; then
            timeout 180s sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -qq
            timeout 420s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              -o DPkg::Lock::Timeout=120 gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
          fi
          command -v x86_64-w64-mingw32-gcc
          command -v i686-w64-mingw32-gcc
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -municode -mwindows \
            runtime-preview/touhou_probe.c -o runtime-preview/touhou_probe.exe \
            -luser32 -lgdi32
          for arch in 32 64; do
            if [ "$arch" = 32 ]; then cc=i686-w64-mingw32-gcc; else cc=x86_64-w64-mingw32-gcc; fi
            "$cc" -std=c11 -O2 -Wall -Wextra -shared \
              runtime-preview/touhou_font_hook.c \
              -o "runtime-preview/touhou_font_hook${arch}.dll" \
              -luser32 -lgdi32
            "$cc" -std=c11 -O2 -Wall -Wextra -municode -mwindows \
              runtime-preview/touhou_font_helper.c \
              -o "runtime-preview/touhou_font_helper${arch}.exe" \
              -luser32
            file "runtime-preview/touhou_font_hook${arch}.dll" "runtime-preview/touhou_font_helper${arch}.exe"
            test $(stat -c %s "runtime-preview/touhou_font_hook${arch}.dll") -gt 5000
            test $(stat -c %s "runtime-preview/touhou_font_helper${arch}.exe") -gt 5000
          done
          file runtime-preview/touhou_probe.exe
          test $(stat -c %s runtime-preview/touhou_probe.exe) -gt 10000

      - name: Apply Touhou runtime preview overlay
        run: python3 runtime-preview/overlay.py upstream

      - name: Build integrated Windows runtime preview
        working-directory: upstream
        run: gradle --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dorg.gradle.workers.max=2 assembleDebug

      - name: Verify APK JNI native cache paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = next(Path("upstream/app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              checked = 0
              for path in z.namelist():
                  if path.startswith("lib/") and path.endswith(".so"):
                      checked += 1
                      if b"/data/data/com.winlator" in z.read(path):
                          raise AssertionError(f"Native library still has old inaccessible app path: {path}")
              assert checked > 0, "No JNI binaries found in APK"
              print("Verified", checked, "native libraries have no stale Winlator app-data path")
          PY

      - name: Verify Japanese fonts and locale shipped in APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = next(Path("upstream/app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              assert "assets/japanese/japanese-support.tzst" in z.namelist()
              assert "assets/licenses/NotoSansCJK-OFL.txt" in z.namelist()
              assert "assets/licenses/IPA-Font-License-1.0.txt" in z.namelist()
              assert len(z.read("assets/japanese/japanese-support.tzst")) > 12000000
              print("Japanese locale and SIL OFL font license included")
          PY

      - name: Verify read-only installer probe is included
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = next(Path("upstream/app/build/outputs/apk/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              name = "assets/japanese/touhou_probe.exe"
              assert name in z.namelist(), "Missing Wine path probe"
              probe = z.read(name)
              assert probe.startswith(b"MZ"), "Probe is not a Windows executable"
              assert len(probe) > 10000
              print("Win32 Japanese diagnostic included:", len(probe), "bytes")
              for arch in ("32", "64"):
                  for name,signature in ((f"touhou_font_helper{arch}.exe",b"MZ"),(f"touhou_font_hook{arch}.dll",b"MZ")):
                      bundled = z.read("assets/japanese/" + name)
                      assert bundled.startswith(signature) and len(bundled) > 5000
                      print("Wine scoped font patch included:", name, len(bundled))
          PY

      - name: Archive LGPL source and derivative patch
        run: |
          mkdir -p upstream/app/src/main/assets/licenses
          cp upstream/LICENSE upstream/app/src/main/assets/licenses/Winlator-LGPL-2.1.txt
          mkdir -p legal-bundle
          cp upstream/LICENSE legal-bundle/Winlator-LGPL-2.1.txt
          cp runtime-preview/NOTICE.md legal-bundle/NOTICE.md
          cp runtime-preview/overlay.py legal-bundle/overlay.py
          cp runtime-preview/rewrite_prefix.py legal-bundle/rewrite_prefix.py
          cp runtime-preview/build_japanese_support.py legal-bundle/build_japanese_support.py
          cp runtime-preview/touhou_probe.c legal-bundle/touhou_probe.c
          cp runtime-preview/touhou_font_hook.c legal-bundle/touhou_font_hook.c
          cp runtime-preview/touhou_font_helper.c legal-bundle/touhou_font_helper.c
          cp upstream/app/src/main/assets/licenses/NotoSansCJK-OFL.txt legal-bundle/NotoSansCJK-OFL.txt
          cp upstream/app/src/main/assets/licenses/IPA-Font-License-1.0.txt legal-bundle/IPA-Font-License-1.0.txt

      - name: Publish runtime preview APK
        uses: actions/upload-artifact@v4
        with:
          name: touhou-pocket-runtime-preview-apk
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish source attribution
        uses: actions/upload-artifact@v4
        with:
          name: touhou-pocket-runtime-legal
          path: legal-bundle/
          if-no-files-found: error
