name: Charoite Boot Preview Video

on:
  push:
    branches: [main]
    paths:
      - 'docs/previews/render_crystal_awakening.py'
      - '.github/workflows/charoite-preview-video.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-preview:
    name: Generate playable 5-second preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare preview video renderer
        run: |
          python3 -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless
          ffmpeg -version | head -1
      - name: Render approved Charoite artwork motion concept
        run: |
          python3 docs/previews/render_crystal_awakening.py
          test -s Charoite_Crystal_Awakening_Preview.mp4
          ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 Charoite_Crystal_Awakening_Preview.mp4 | grep '^5.000000$'
          sha256sum Charoite_Crystal_Awakening_Preview.mp4
      - name: Upload MP4 for direct GitHub download
        uses: actions/upload-artifact@v4
        with:
          name: Charoite-Crystal-Awakening-Preview-MP4
          path: Charoite_Crystal_Awakening_Preview.mp4
          retention-days: 30
          if-no-files-found: error
