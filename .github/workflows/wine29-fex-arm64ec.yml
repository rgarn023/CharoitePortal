name: Wine29 FEX ARM64EC candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wine29-fex-arm64ec.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-translator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FEX_REVISION: bce85d9941b2d37755f3b44a4f6e178617d94fba
    steps:
      - name: Fetch pinned FEX and compiler
        run: |
          set -euo pipefail
          git init fex
          git -C fex remote add origin https://github.com/FEX-Emu/FEX.git
          git -C fex fetch --depth 1 origin "$FEX_REVISION"
          git -C fex checkout --detach FETCH_HEAD
          git -C fex submodule update --init --recursive --depth 1
          archive=llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl -fsSL --retry 3 "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/$archive" -o "$RUNNER_TEMP/$archive"
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
      - name: Build upstream ARM64EC DLL
        run: |
          cmake -S fex -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=Data/CMake/toolchain_mingw.cmake \
            -DMINGW_TRIPLE=arm64ec-w64-mingw32 -DENABLE_LTO=OFF \
            -DENABLE_ASSERTIONS=OFF -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DBUILD_TESTING=OFF -DTUNE_ARCH=generic -DTUNE_CPU=none -DRANGES_NATIVE=OFF
          cmake --build build --target arm64ecfex --parallel 2
      - name: Audit translator binary
        run: |
          set -euo pipefail
          mkdir artifact
          dll=$(find build -type f -name libarm64ecfex.dll)
          cp "$dll" artifact/
          llvm-readobj --file-headers --coff-exports --coff-imports "$dll" > artifact/pe-report.txt
          for symbol in ProcessInit ThreadInit BeginSimulation DispatchJump ExitToX64 RetToEntryThunk BTCpu64IsProcessorFeaturePresent; do
            grep -Eq "Name: ${symbol}$" artifact/pe-report.txt
          done
          printf '%s\n' "$FEX_REVISION" > artifact/source-revision.txt
          (cd artifact && sha256sum libarm64ecfex.dll > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Wine29-FEX-ARM64EC-candidate
          path: artifact/
          if-no-files-found: error
